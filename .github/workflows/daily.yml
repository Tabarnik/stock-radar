name: Reddit Stock Radar

# Three sends per weekday: pre-market, midday, close.
# Single cron per slot — no ET gate needed, no missed sends.
# Times shift 1 hour between EDT and EST (acceptable for a radar).
#
# Each run also publishes the HTML dashboard in docs/ to GitHub Pages.

on:
  schedule:
    - cron: '0 13 * * 1-5'   # ~9 AM EDT / 8 AM EST
    - cron: '0 17 * * 1-5'   # ~1 PM EDT / 12 PM EST
    - cron: '0 21 * * 1-5'   # ~5 PM EDT / 4 PM EST
  workflow_dispatch: {}        # manual trigger always runs

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs deploy Pages at the same time.
concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APEWISDOM_FILTER: Shortsqueeze,pennystocks,wallstreetbets,all-stocks
          EXCHANGE_FILTER: '1'
          INCLUDE_CANADIAN: '0'
          TOP_N: '10'
          MAX_VALIDATE: '50'
          DASHBOARD_DIR: docs
        run: python main.py

      # ---- publish the dashboard to GitHub Pages ----
      # continue-on-error throughout: the notification is the primary job and
      # already succeeded by this point, so a Pages problem must never fail the run.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true      # turn Pages on the first time, no manual setup
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
