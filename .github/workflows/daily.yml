name: Stock Radar

# Three sends per weekday: 8 AM pre-market, 1 PM midday, 4 PM market close (ET).
# Single cron per slot — no ET gate. The old dual-cron + gate setup returned
# before gather() and left 181 of 204 runs empty; do not reintroduce it.
#
# Cron is UTC, so one set of times cannot hold ET across DST. These are pinned to
# EDT (mid-March to early November, i.e. most of the year). Under EST they land
# an hour earlier — 7 AM / 12 PM / 3 PM ET. To correct that in November, add 1
# to each hour below: 13, 18, 21.
#
# GitHub's scheduler is best-effort and runs LATE under load, never early —
# observed 1 to 2 hours behind. So these are the earliest a send can arrive, not
# the time it will. That is deliberate for the close slot: firing at or after
# 20:00 UTC means the digest carries settled closing prices rather than
# mid-auction ones.
#
# Each run also refreshes the account view (backtest.json: holdings, days left,
# the compounded curve) from the same prices and commits it alongside the digest
# data, then publishes the HTML dashboard in docs/ to GitHub Pages.

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 8 AM EDT — pre-market (7 AM under EST)
    - cron: '0 17 * * 1-5'   # 1 PM EDT — midday   (12 PM under EST)
    - cron: '0 20 * * 1-5'   # 4 PM EDT — close    (3 PM under EST)
  workflow_dispatch: {}        # manual trigger always runs

permissions:
  contents: write     # commit the refreshed docs/data.json back to main
  pages: write
  id-token: write

# Never let two runs deploy Pages at the same time.
concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # A feed name ApeWisdom does not recognise is logged as a warning and
          # skipped, so an unsupported one degrades the mix rather than the run.
          APEWISDOM_FILTER: Shortsqueeze,pennystocks,wallstreetbets,all-stocks,stocks,tradingwithcongress
          EXCHANGE_FILTER: '1'
          INCLUDE_CANADIAN: '0'
          TOP_N: '10'
          MAX_VALIDATE: '50'
          DASHBOARD_DIR: docs
        run: python main.py

      # ---- refresh the board's account view on the same run ----
      # Holdings, days-left and the compounded curve all come out of
      # backtest.json. Run manually it went stale between runs and the digest
      # could show a position the account model had already sold. It has to run
      # AFTER main.py: main.py appends today's picks to history.json, and the
      # backtest reads that file to build the pick record.
      #
      # continue-on-error, and deliberately after the send: the ntfy digest is
      # the primary job and has already gone out by this point, so a Yahoo
      # failure here must never fail the run. STAKE is left unset so backtest.py
      # uses its own default rather than a workflow input silently overriding it.
      - name: Refresh backtest and holdings
        continue-on-error: true
        env:
          DASHBOARD_DIR: docs
        run: python backtest.py

      # ---- commit the fresh data back to the repo ----
      # Gives a working board (and a run history) even before Pages is enabled,
      # and lets a Raspberry Pi pull data without running Python itself.
      # history.json is committed too: main.py rewrites it every run (new picks,
      # marked to market) and it was previously left behind, so the pick record
      # only ever moved when the manual backtest happened to commit it.
      - name: Commit dashboard data
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/backtest.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "radar data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push origin HEAD:main

      # ---- publish the dashboard to GitHub Pages ----
      # continue-on-error throughout: the notification is the primary job and
      # already succeeded by this point, so a Pages problem must never fail the run.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true      # turn Pages on the first time, no manual setup
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
