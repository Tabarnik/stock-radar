name: Reddit Stock Radar

# Three sends per weekday: pre-market, midday, close.
# Single cron per slot — no ET gate needed, no missed sends.
# Times shift 1 hour between EDT and EST (acceptable for a radar).

on:
  schedule:
    - cron: '0 13 * * 1-5'   # ~9 AM EDT / 8 AM EST
    - cron: '0 17 * * 1-5'   # ~1 PM EDT / 12 PM EST
    - cron: '0 21 * * 1-5'   # ~5 PM EDT / 4 PM EST
  workflow_dispatch: {}        # manual trigger always runs

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APEWISDOM_FILTER: Shortsqueeze,pennystocks,wallstreetbets,all-stocks
          EXCHANGE_FILTER: '1'
          INCLUDE_CANADIAN: '0'
          TOP_N: '10'
          MAX_VALIDATE: '50'
        run: python main.py
