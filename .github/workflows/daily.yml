name: Reddit Stock Radar

# Free cloud schedule (your "server") — runs even when your Mac is off.
# Only secret needed: NTFY_TOPIC.
# Two cron lines per target hour + RUN_HOURS_ET make it fire DST-proof:
# whichever UTC time equals an intended ET hour sends; the others exit early.
# Fires at 8 AM, 12 PM, and 4 PM ET on weekdays.

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 08:00 EDT (summer)
    - cron: '0 13 * * 1-5'   # 08:00 EST (winter)
    - cron: '0 16 * * 1-5'   # 12:00 EDT (summer)
    - cron: '0 17 * * 1-5'   # 12:00 EST (winter)
    - cron: '0 20 * * 1-5'   # 16:00 EDT (summer)
    - cron: '0 21 * * 1-5'   # 16:00 EST (winter)
  workflow_dispatch: {}        # manual test (always runs, ignores the ET gate)

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APEWISDOM_FILTER: Shortsqueeze,pennystocks
          EXCHANGE_FILTER: '1'
          INCLUDE_CANADIAN: '0'
          RUN_HOURS_ET: '8,12,16'
        run: python main.py
