name: Stock Radar

# Three sends per weekday: 8 AM pre-market, 1 PM midday, 4 PM market close (ET).
# Single cron per slot — no ET gate. The old dual-cron + gate setup returned
# before gather() and left 181 of 204 runs empty; do not reintroduce it.
#
# Cron is UTC, so one set of times cannot hold ET across DST. These are pinned to
# EDT (mid-March to early November, i.e. most of the year). Under EST they land
# an hour earlier — 7 AM / 12 PM / 3 PM ET. To correct that in November, add 1
# to each hour below: 13, 18, 21.
#
# GitHub's scheduler is best-effort and runs LATE, never early. Measured over ten
# scheduled runs: median 74 minutes behind, worst 156, and the morning slot was
# consistently the worst of the three. These are the earliest a send can arrive,
# not the time it will.
#
# The minutes are deliberate. Cron on the hour is the most contended slot on the
# platform — everyone schedules :00 — so these sit at :50 and :05 instead. It
# reduces the queue, it does not fix it: only an external trigger calling
# workflow_dispatch starts on time (those fire within seconds).
#
# The close slot stays AFTER 20:00 UTC on purpose. Moving it earlier to absorb
# lag would mean a punctual run carried pre-close prices, which is worse than
# arriving late with settled ones.
#
# Each run also refreshes the account view (backtest.json: holdings, days left,
# the compounded curve) from the same prices and commits it alongside the digest
# data. It does NOT publish Pages — refresh.yml does that, and having both in the
# github-pages environment is what deadlocked them.

on:
  schedule:
    - cron: '50 11 * * 1-5'  # ~8 AM EDT — pre-market (7 AM under EST)
    - cron: '50 16 * * 1-5'  # ~1 PM EDT — midday   (12 PM under EST)
    - cron: '5 20 * * 1-5'   # ~4 PM EDT — close    (3 PM under EST)
  # Dispatching this sends a REAL notification. To publish a dashboard change,
  # use refresh.yml instead — it re-prices and deploys without notifying.
  workflow_dispatch: {}

permissions:
  contents: write     # commit the refreshed docs/data.json back to main

# Its own group. This workflow no longer deploys Pages, so it can never be held
# in the `waiting` state behind a deployment — which is exactly what stopped the
# digest for two days: a refresh run stuck waiting on github-pages held the
# shared group and every later run queued behind it and was cancelled.
concurrency:
  group: radar-digest
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          NOTIFY_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # A feed name ApeWisdom does not recognise is logged as a warning and
          # skipped, so an unsupported one degrades the mix rather than the run.
          APEWISDOM_FILTER: Shortsqueeze,pennystocks,wallstreetbets,all-stocks,stocks,tradingwithcongress
          EXCHANGE_FILTER: '1'
          INCLUDE_CANADIAN: '0'
          TOP_N: '10'
          MAX_VALIDATE: '50'
          DASHBOARD_DIR: docs
        run: python main.py

      # ---- refresh the board's account view on the same run ----
      # Holdings, days-left and the compounded curve all come out of
      # backtest.json. Run manually it went stale between runs and the digest
      # could show a position the account model had already sold. It has to run
      # AFTER main.py: main.py appends today's picks to history.json, and the
      # backtest reads that file to build the pick record.
      #
      # continue-on-error, and deliberately after the send: the ntfy digest is
      # the primary job and has already gone out by this point, so a Yahoo
      # failure here must never fail the run. STAKE is left unset so backtest.py
      # uses its own default rather than a workflow input silently overriding it.
      - name: Refresh backtest and holdings
        continue-on-error: true
        env:
          DASHBOARD_DIR: docs
        run: python backtest.py

      # ---- commit the fresh data back to the repo ----
      # Gives a working board (and a run history) even before Pages is enabled,
      # and lets a Raspberry Pi pull data without running Python itself.
      # history.json is committed too: main.py rewrites it every run (new picks,
      # marked to market) and it was previously left behind, so the pick record
      # only ever moved when the manual backtest happened to commit it.
      - name: Commit dashboard data
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/backtest.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "radar data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push origin HEAD:main

      # Pages is published by refresh.yml, the only workflow that deploys it.
      # Two workflows in the github-pages environment deadlocked on the
      # deployment queue; the digest is the job that must never be blocked, so
      # it commits the data and lets the next refresh (<=20 min) publish it.
