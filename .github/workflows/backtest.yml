name: Backtest

# Replays every digest the radar ever sent against today's prices.
#
# The daily workflow now runs backtest.py on every scheduled run, so the board's
# holdings and curve refresh 3x a weekday alongside the ntfy digest. This one is
# for ad-hoc analysis: re-running after a code change, or trying a different
# stake without waiting for the next scheduled send.

on:
  workflow_dispatch:
    inputs:
      stake:
        description: 'Dollars per ticker for the per-ticker tables (blank = code default)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Backfill pick history
        continue-on-error: true
        env:
          DASHBOARD_DIR: docs
        run: python backfill_history.py
      # An empty input must not reach STAKE as "": float("") raises, and a
      # non-empty default here silently beat the code default once already
      # (it reported $690,000 invested).
      - name: Run backtest
        env:
          DASHBOARD_DIR: docs
        run: |
          if [ -n "${{ inputs.stake }}" ]; then
            export STAKE="${{ inputs.stake }}"
            echo "STAKE overridden to $STAKE"
          fi
          python backtest.py
      - name: Commit results
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.json docs/history.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "backtest results $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push back to whatever ref was dispatched, not always main — running
          # this on a branch used to shove the branch's commits onto main
          git push origin HEAD:"$GITHUB_REF_NAME"
