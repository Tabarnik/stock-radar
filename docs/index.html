/* ── watchlist ────────────────────────────────────────────── */
function watchlist(){
  // Every run appends that day's picks to history.json, so past lists are real
  // records rather than a re-derivation from today's prices.
  const hist = D.history || [];
  const byDay = {};
  hist.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const days = Object.keys(byDay).sort().reverse();
  const today = (D.generated_at || "").slice(0, 10);
  const showing = S.day && (S.day === "today" || byDay[S.day]) ? S.day : "today";
  const isToday = showing === "today";
  const q = D.watch || [];
  const past = isToday ? [] : byDay[showing] || [];

  const options = [`<option value="today"${isToday ? " selected" : ""}>Today (${
    q.length})</option>`].concat(days
      .filter(d => d !== today)
      .map(d => {
        const sim = byDay[d].every(e => e.simulated);
        return `<option value="${d}"${showing === d ? " selected" : ""}>${
          fmtPickDay(d)} (${byDay[d].length})${sim ? " · reconstructed" : ""}</option>`;
      })).join("");

  const head = `<div class="panel" style="margin-bottom:16px;padding:22px 24px;">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
        <div>
          <div class="eyebrow" style="margin-bottom:10px;">Picks of the day</div>
          <div style="font-size:26px;font-weight:600;letter-spacing:-.02em;
            color:var(--ink-d);">${isToday ? `${q.length} pick${q.length===1?"":"s"} today`
              : `${past.length} pick${past.length===1?"":"s"} on ${esc(fmtPickDay(showing))}`}</div>
        </div>
        <div style="flex:1 1 20px;"></div>
        <label class="note" for="dayfilter" style="letter-spacing:.06em;">Show</label>
        <select id="dayfilter" class="sel" data-day>${options}</select>
      </div>
      <div style="margin-top:8px;font-size:13px;color:var(--ink-3);max-width:70ch;">
        ${isToday
          ? `Refreshed three times every weekday — pre-market, midday and after the
             close. Each run appends its picks here, so this list is also the record.`
          : `What was picked on ${esc(fmtPickDay(showing))}, priced at the flag and marked to the
             latest run. This is the record as it was made, not a re-run with
             hindsight.`}</div>
    </div>`;

  if (!isToday) {
    if (!past.length) return head + `<div class="panel"><div class="empty">
      Nothing was picked on ${esc(fmtPickDay(showing))}.</div></div>`;
    // the 5-day outcome is per (day, ticker): the same name flagged on three
    // days has three entry prices and three exits, so it cannot be looked up
    // by symbol alone
    const PD = {};
    ((B && B.pick_detail) || []).forEach(p => { PD[p.date + "|" + p.sym] = p; });
    const nD = holdDays();

    // A name already in the account is not a second buy, so it is listed apart
    // from the ones you would have acted on and left out of the day's average.
    const bought = past.filter(e => !(PD[e.date + "|" + e.sym] || {}).already_held);
    const holding = past.filter(e => (PD[e.date + "|" + e.sym] || {}).already_held);
    const sold = bought.map(e => (PD[e.date + "|" + e.sym] || {}).ret_hold)
                       .filter(v => typeof v === "number");
    const dayAvg = sold.length ? sold.reduce((a, b) => a + b, 0) / sold.length : null;

    const OPd = openPos();
    const rowsFor = list => list.map(e => {
        const d = PD[e.date + "|" + e.sym];
        // "not due" alone leaves you wondering when you will know — say it
        const dl = (OPd[e.sym] || {}).days_left;
        const soldCell = !d ? `<span style="color:var(--ink-5);">—</span>`
          : d.still_open ? `<span class="note" style="margin:0;white-space:nowrap;">${
              typeof dl === "number"
                ? (dl === 0 ? "sells today" : `in ${dl} day${dl===1?"":"s"}`)
                : "not due"}</span>`
          : `<span style="color:${chgC(d.ret_hold)};">${pctT(d.ret_hold)}</span>`;
        return `<div class="row clickable" data-open="${esc(e.sym)}">
        <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
          <div class="mono" style="flex:0 0 84px;font-size:14px;font-weight:600;
            color:var(--ink-d);">$${esc(e.sym)}</div>
          <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(e.flag_price)}</div>
          <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(e.last_price)}</div>
          <div class="mono" style="flex:0 0 92px;text-align:right;font-size:13px;
            color:${chgC(e.pct)};">${pctT(e.pct)}</div>
          <div class="mono" style="flex:0 0 104px;text-align:right;font-size:13px;
            font-weight:600;">${soldCell}</div>
          <div style="flex:1 1 150px;min-width:0;display:flex;align-items:center;gap:10px;">
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")};font-size:10px;">${esc(e.outcome)}</span>
            ${e.simulated ? `<span class="pill" style="${pillCss("warn")};font-size:10px;"
              title="Never sent — the pick section did not exist yet. This name was
judged by hand to be one the rule would have taken; the rule was not re-run
against that day's data, which no longer exists.">reconstructed</span>` : ""}
            <span style="font-size:12px;color:var(--ink-4);white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis;">${esc(e.note||"")}</span>
          </div>
        </div></div>`; }).join("");

    const tblHead = `<div class="tbl">
        <div style="flex:0 0 84px;">Ticker</div>
        <div style="flex:0 0 90px;text-align:right;">At pick</div>
        <div style="flex:0 0 90px;text-align:right;">Now</div>
        <div style="flex:0 0 92px;text-align:right;">Still held</div>
        <div style="flex:0 0 104px;text-align:right;"
          title="What the ${nD}-day rule actually paid: sold at the close ${nD} trading days after the pick."
          >Sold at ${nD}d</div>
        <div style="flex:1 1 150px;">Since</div>
      </div>`;

    return head + `<div class="panel">
      <div class="phead"><div class="cap">Would have bought</div>
        <div class="note">${bought.length} name${bought.length===1?"":"s"} not already
          in the account${dayAvg !== null ? ` · the day averaged
          <b style="color:${chgC(dayAvg)};">${pctT(+dayAvg.toFixed(1))}</b> on the
          ${nD}-day rule` : ""}</div></div>
      ${bought.length ? `<div class="scroll"><div style="min-width:760px;">
        ${tblHead}${rowsFor(bought)}</div></div>`
        : `<div class="empty">Every name on this day's list was already held.</div>`}
    </div>
    ${holding.length ? `<div class="panel" style="margin-top:16px;">
      <div class="phead"><div class="cap" style="color:${H};">Already holding — don't buy again</div>
        <div class="note">flagged again while the position was still open, so no
          second buy and no effect on the day's return</div></div>
      <div class="scroll"><div style="min-width:830px;">
        <div class="tbl">
          <div style="flex:0 0 84px;">Ticker</div>
          <div style="flex:0 0 90px;text-align:right;"
            title="The price on this day's list — not what the open position was bought at, which was an earlier day."
            >Flagged at</div>
          <div style="flex:0 0 90px;text-align:right;">Now</div>
          <div style="flex:0 0 86px;text-align:right;"
            title="Change from this day's flag price to the latest run.">Since flag</div>
          <div style="flex:0 0 96px;text-align:right;"
            title="Change on the open position, from the price it was actually bought at on the earlier pick day."
            >Since buy</div>
          <div style="flex:1 1 190px;">Status that day</div>
        </div>
        ${holding.map(e => {
          const d = PD[e.date + "|" + e.sym] || {};
          const dl = d.days_left;
          return `<div class="row clickable" data-open="${esc(e.sym)}">
          <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
            <div class="mono" style="flex:0 0 84px;font-size:14px;font-weight:600;
              color:${H};">$${esc(e.sym)}</div>
            <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
              color:var(--ink-2);">${money(e.flag_price)}</div>
            <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
              color:var(--ink-2);">${money(e.last_price)}</div>
            <div class="mono" style="flex:0 0 86px;text-align:right;font-size:13px;
              color:${chgC(e.pct)};">${pctT(e.pct)}</div>
            <div class="mono" style="flex:0 0 96px;text-align:right;font-size:13px;
              font-weight:600;color:${typeof d.ret_since_buy === "number"
                ? chgC(d.ret_since_buy) : "var(--ink-5)"};"${
              d.buy_price ? ` title="Bought ${esc(fmtPickDay(d.held_since))} at ${
                money(d.buy_price)}"` : ""}>${
              typeof d.ret_since_buy === "number"
                ? pctT(d.ret_since_buy) : "—"}</div>
            <div style="flex:1 1 190px;min-width:0;display:flex;align-items:center;gap:10px;">
              <span class="pill" style="${pillCss("held")};font-size:10px;">held</span>
              <span style="font-size:12px;color:var(--ink-4);">${
                typeof dl === "number"
                  ? `${dl} more trading day${dl===1?"":"s"} to run`
                  : "position still open"}</span>
            </div>
          </div></div>`; }).join("")}
      </div></div>
    </div>` : ""}
    <div class="panel" style="margin-top:16px;padding:14px 18px;">
      <div class="note"><b>Still held</b> is the change from the pick price to the
      latest run — what the name did afterwards, whether or not you were in it.
      <b>Sold at ${nD}d</b> is what the rule you actually trade would have paid:
      out at the close ${nD} trading days after the pick. They diverge sharply on
      names that spiked and then bled out, which is the whole case for the
      rule.${past.some(e => e.simulated) ? ` Rows marked <b>reconstructed</b> were
      never sent — see the note at the foot of this screen before reading them as
      a record.` : ""}</div>
    </div>`;
  }

  return head + (q.length ? `<div class="grid">${q.map(t => `
      <div class="panel" style="min-width:0;padding:16px 18px;">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <span class="sym clickable" data-open="${esc(t.sym)}">$${esc(t.sym)}</span>
          <span class="mono" style="font-size:13px;color:var(--ink-2);">${money(t.price)}</span>
          <span class="mono" style="font-size:13px;color:${chgC(t.pct)};margin-left:auto;">
            ${pctT(t.pct)}</span>
        </div>
        <div class="co" style="max-width:100%;margin-top:2px;">${esc(t.name||"")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;">
          <span class="pill" style="${pillCss("muted")}">${esc(t.tag||"")}</span>
          ${readPill(t)}${erHtml(t, true)}${flagsHtml(t, 1)}
        </div>
        ${upsideLine(t)}
        ${t.band ? bandHtml(t) : ""}
        <div style="margin-top:12px;">${newsHtml(t, 2)}</div>
        <button class="btn" style="margin-top:12px;" data-open="${esc(t.sym)}">OPEN DETAIL →</button>
      </div>`).join("")}</div>`
    : `<div class="panel"><div class="empty">Nothing cleared the filter today.</div></div>`);
}

/* ── backtest (replay of every digest ever sent) ──────────── */
// Same label the Digest uses. These were "Worth Watching" here and "Picks of
// the day" there, which read as two different lists — it is one list.
const TIER = {
  pick:  ["Picks of the day", "the shortlist — the only section framed as something to act on"],
  buzz:  ["Reddit Buzz",    "whatever the crowd was loudest about that day"],
  mover: ["Market gainers", "names that had already jumped, labelled “not a prediction”"],
};
const usd = n => (n < 0 ? "−" : "+") + "$" + Math.abs(Math.round(n)).toLocaleString();

// Plain-language read of a section's record. Descriptive only — it reports what
// happened, it does not forecast what happens next.
// NB: named tierVerdict, not verdict — the digest hero already owns verdict(),
// and a second declaration silently replaced it.
function tierVerdict(t, s){
  if (s.positions < 5)
    return ["muted", "too few to judge",
            `Only ${s.positions} position${s.positions===1?"":"s"} — no read yet.`];
  if (s.return_pct >= 5)
    return ["good", "made money",
            `${s.winners} of ${s.positions} rose. This is the section with a record behind it.`];
  if (s.return_pct > -5)
    return ["muted", "roughly flat",
            `${s.winners} of ${s.positions} rose — close enough to a coin flip to ignore.`];
  return ["bad", "lost money",
          `Only ${s.winners} of ${s.positions} rose. Buying this list cost you money.`];
}

/* Competing sell rules replayed over the same historical positions. The point
   is the comparison against holding, not any single number. */
function exitRules(){
  // picks only — the wider history is quoted as corroboration, not as the headline
  const RS = B.exit_rules_picks || [];
  const ALL = B.exit_rules || [];
  if (RS.length < 3) return "";
  const hold = RS.find(e => e.rule === "Hold, never sell");
  const best = RS[0];
  if (!hold) return "";
  const beat = RS.filter(e => e.avg_return > hold.avg_return).length;
  const stake = B.stake || 0;
  const allHold = ALL.find(e => e.rule === "Hold, never sell");
  const allBeat = allHold ? ALL.filter(e => e.avg_return > allHold.avg_return).length : 0;
  let lead = beat === RS.length - 1
    ? `Every rule tested beat holding your picks.`
    : `${beat} of ${RS.length - 1} rules beat holding your picks.`;
  // where the rule the compounded account actually trades landed — saying it
  // ranked first when it did not would be the easiest lie on this page
  const curve = RS.find(e => e.rule === (B.curve_rule || ""));
  const hero = curve || best;          // lead with what you do, not what won
  if (curve) {
    const rank = RS.indexOf(curve) + 1;
    lead += rank === 1
      ? ` The rule you trade, ${curve.rule.toLowerCase()}, came out on top.`
      : ` The rule you trade, ${curve.rule.toLowerCase()}, ranked ${rank} of
          ${RS.length} at ${curve.avg_return > 0 ? "+" : ""}${curve.avg_return}%
          against ${best.avg_return}% for the best.`;
  }
  // 9 of these picks were reconstructed from digests that predate the pick
  // section — they were never sent, and folding them in silently would inflate
  // the record with names the radar never actually put in front of anyone
  const sent = hold.positions_real;
  if (sent && sent < hold.positions) {
    const c = RS.find(e => e.rule === (B.curve_rule || "")) || best;
    lead += ` Only ${sent} of these ${hold.positions} picks were really sent —
      the other ${hold.positions - sent} are reconstructed from digests that predate
      the pick section. Over the ${sent} real ones ${c.rule.toLowerCase()} returns
      ${c.avg_return_real > 0 ? "+" : ""}${c.avg_return_real}%.`;
  }
  if (hold.positions < 30) {
    lead += ` ${hold.positions} picks so far and the record grows with every run, so this ranking will move — it is your average, not an industry rule of thumb.`;
  }

  return `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">When to sell</div>
      <div class="note">your own picks — ${hold.positions} of them${
        sent ? `, ${sent} really sent` : ""} ·
        $${(B.start_cash||10000).toLocaleString()} spread across them · updates every run</div></div>

    <div style="padding:18px;display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;">
      <div>
        <div class="eyebrow" style="margin-bottom:6px;">${
          curve === best ? "The rule you trade — and your best exit so far"
                         : "The rule you trade"}</div>
        <div class="mono" style="font-size:26px;font-weight:600;color:${
          hero.avg_return >= 0 ? G : R};line-height:1;">${esc(hero.rule)}</div>
        <div class="mono" style="font-size:13px;margin-top:6px;color:${
          hero.avg_return >= 0 ? G : R};">
          $${Math.round(hero.invested||0).toLocaleString()} → $${
            Math.round(hero.final).toLocaleString()}
          (${hero.avg_return > 0 ? "+" : ""}${hero.avg_return}%)</div>
        <div class="mono" style="font-size:12px;color:var(--ink-5);margin-top:4px;">
          vs holding: $${Math.round(hold.final).toLocaleString()}
          (${hold.avg_return > 0 ? "+" : ""}${hold.avg_return}%)</div>
      </div>
      <div style="flex:1 1 280px;min-width:0;">
        <div style="font-size:14px;color:var(--ink-3);text-wrap:pretty;">${esc(lead)}</div>
        <div class="note" style="margin-top:8px;">Replayed on closing prices with no
          costs, slippage or tax. A rule that wins here is a discipline worth having,
          not a guarantee about the next trade.</div>
      </div>
    </div>

    <div class="scroll"><div style="min-width:620px;">
      <div class="tbl">
        <div style="flex:1 1 200px;">Sell rule</div>
        <div style="flex:0 0 104px;text-align:right;">Ends at</div>
        <div style="flex:0 0 84px;text-align:right;">Avg return</div>
        <div style="flex:0 0 70px;text-align:right;">Win rate</div>
        <div style="flex:0 0 86px;text-align:right;">Days held</div>
        <div style="flex:0 0 80px;text-align:right;">Worst</div>
      </div>
      ${(() => {          // top five, plus the curve's rule and the baseline if missed
        let rs = RS.slice(0, 5);
        if (curve && !rs.includes(curve)) rs = rs.concat([curve]);
        if (!rs.includes(hold)) rs = rs.concat([hold]);
        return rs;
      })().map(e => {
        const isHold = e.rule === "Hold, never sell";
        const isCurve = !!curve && e.rule === curve.rule;
        const better = e.avg_return > hold.avg_return;
        return `<div class="row" ${isHold ? 'style="background:rgba(120,112,90,0.07);"' : ""}>
          <div style="display:flex;gap:12px;padding:11px 18px;align-items:center;">
            <div style="flex:1 1 200px;min-width:0;display:flex;align-items:center;
              gap:8px;flex-wrap:wrap;">
              <span style="font-size:13px;color:var(--ink-2);${
                isHold || isCurve ? "font-weight:600;" : ""}">${esc(e.rule)}</span>
              ${isHold ? `<span class="pill" style="${pillCss("muted")};font-size:10px;">
                baseline</span>` : ""}
              ${isCurve ? `<span class="pill" style="${pillCss("good")};font-size:10px;">
                your curve</span>` : ""}
              ${!isHold && better ? `<span class="pill" style="${pillCss("good")};
                font-size:10px;">better</span>` : ""}
            </div>
            <div class="mono" style="flex:0 0 104px;text-align:right;font-size:13px;
              font-weight:600;color:${e.avg_return>=0?G:R};">
              $${Math.round(e.final).toLocaleString()}</div>
            <div class="mono" style="flex:0 0 84px;text-align:right;font-size:12px;
              color:${chgC(e.avg_return)};">${pctT(e.avg_return)}</div>
            <div class="mono" style="flex:0 0 70px;text-align:right;font-size:12px;
              color:var(--ink-4);">${e.win_rate}%</div>
            <div class="mono" style="flex:0 0 86px;text-align:right;font-size:12px;
              color:var(--ink-4);">${e.avg_days_held}</div>
            <div class="mono" style="flex:0 0 80px;text-align:right;font-size:12px;
              color:${chgC(e.worst)};">${pctT(e.worst)}</div>
          </div></div>`;
      }).join("")}
    </div></div>
  </div>`;
}

function backtest(){
  if (!B) return "";
  const eq = B.equity || [];
  const start = B.start_cash || 10000;
  const pickRows = (B.rows || []).filter(r => r.tier === "pick");
  if (!eq.length && !pickRows.length) return "";

  // Positions now overlap, so the account is worth what it is worth today —
  // not whatever it happened to be on the last pick day.
  const finalBal = B.final_balance != null ? B.final_balance
                 : (eq.length ? eq[eq.length - 1].balance : start);
  const frac = B.position_frac || 0.05;
  const rule = B.curve_rule || "stop -15% / target +15%";
  const starved = (B.starved_days || []).length;
  const totalPct = ((finalBal - start) / start) * 100;
  const wins = eq.filter(e => e.return_pct > 0).length;

  const curve = eq.length ? `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">Picks, compounded</div>
      <div class="note">$${start.toLocaleString()} account · ${Math.round(frac*100)}% of it
        into every pick · positions close at ${esc(rule)}</div></div>

    <div style="padding:20px 18px;display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;">
      <div>
        <div class="mono" style="font-size:14px;color:var(--ink-5);">
          $${start.toLocaleString()} →</div>
        <div class="mono" style="font-size:38px;font-weight:600;letter-spacing:-.02em;
          color:${totalPct>=0?G:R};line-height:1;">$${Math.round(finalBal).toLocaleString()}</div>
        <div class="mono" style="font-size:13px;color:${totalPct>=0?G:R};margin-top:6px;">
          ${totalPct>0?"+":""}${totalPct.toFixed(1)}% over ${eq.length} pick day${
            eq.length===1?"":"s"}</div>
      </div>
      <div style="flex:1 1 240px;min-width:0;font-size:13px;color:var(--ink-3);
        text-wrap:pretty;">
        ${wins} of ${eq.length} pick days made money. Every pick gets the same
        ${Math.round(frac*100)}% of the account — so a day with one name risks
        ${Math.round(frac*100)}%, not the whole day's budget — and each position runs
        until ${esc(rule)} closes it, so several days' picks are live at once and the
        cash that comes back funds the next buy. <b>Each</b> is what went into one
        ticker that day. <b>Picks</b> counts the positions actually opened — a name the
        radar flagged again while the account still held it is not bought twice, so
        where a row reads "1 of 2" the second name was already owned and its result
        sits on the earlier row that bought it. <b>Held</b> is how long that basket
        actually ran before its exit fired, in calendar days — ${holdDays()} trading
        days is about ${holdDays() + 2} of them, more across a holiday, which is why the
        column reads higher than the rule. <b>Return</b> is what the basket paid when it sold; on rows tagged <b>open</b> the
        position has not reached its ${holdDays()}-day exit yet, so the figure is marked
        to the latest price and can still move. <b>Account</b> is what the whole account was worth on the day that
        basket was bought.${starved ? ` ${starved} pick day${starved===1?" was":"s were"}
        cut short with no cash free.` : ""} Click any row for that day's picks.
      </div>
    </div>

    <!-- 440px predates the Each/Held columns: the fixed cells alone now need
         ~570px, so the only flexible cell was crushed and the "open" pill
         overlapped the Picks column. Let it scroll instead. -->
    <div class="scroll"><div style="min-width:640px;">
      <div class="tbl">
        <div style="flex:1 1 120px;">Pick day</div>
        <div style="flex:0 0 70px;text-align:right;">Picks</div>
        <div style="flex:0 0 100px;text-align:right;">Each</div>
        <div style="flex:0 0 78px;text-align:right;">Held</div>
        <div style="flex:0 0 90px;text-align:right;"
          title="Rows without an 'open' tag are realised — the position was sold at the 5-day exit and this is what it paid. Rows tagged 'open' are still running, marked to the latest price."
          >Return</div>
        <div style="flex:0 0 110px;text-align:right;">Account</div>
      </div>
      ${eq.map(e => `<div class="row clickable" data-day-go="${esc(e.date)}"
        title="Open the picks from ${esc(fmtPickDay(e.date))}"><div style="display:flex;gap:12px;
          padding:11px 18px;align-items:center;">
        <div style="flex:1 1 120px;min-width:0;display:flex;align-items:center;gap:8px;">
          <span style="font-size:12px;color:var(--ink-2);">${esc(fmtPickDay(e.date))}</span>
          ${e.open ? `<span class="pill" style="${pillCss("muted")};font-size:10px;">open</span>` : ""}
        </div>
        <div class="mono" style="flex:0 0 70px;text-align:right;font-size:12px;
          color:var(--ink-4);"${(e.held_already||[]).length ? ` title="The radar
flagged ${e.flagged} that day. ${(e.held_already||[]).join(', ')} ${
(e.held_already||[]).length===1?'was':'were'} already held from an earlier pick and
not bought again, so this row covers only the ${e.picks} position${
e.picks===1?'':'s'} actually opened."` : ""}>${e.picks}${
          (e.held_already||[]).length ? `<span style="color:var(--ink-5);"> of ${
            e.flagged}</span>` : ""}</div>
        <div class="mono" style="flex:0 0 100px;text-align:right;font-size:12px;
          color:var(--ink-2);">$${Math.round(e.per_ticker||0).toLocaleString()}</div>
        <div class="mono" style="flex:0 0 78px;text-align:right;font-size:12px;
          color:var(--ink-5);">${e.held_days}d</div>
        <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
          color:${chgC(e.return_pct)};">${pctT(e.return_pct)}${
          e.open ? `<span style="display:block;font-size:10px;color:var(--ink-5);
            font-weight:400;letter-spacing:.04em;">so far</span>` : ""}</div>
        <div class="mono" style="flex:0 0 110px;text-align:right;font-size:13px;
          font-weight:600;color:${e.balance>=start?G:R};">
          $${Math.round(e.balance).toLocaleString()}</div>
      </div></div>`).join("")}
    </div></div>
  </div>` : "";

  return curve + exitRules();
}

/* ── history ──────────────────────────────────────────────── */
function history(){
  const all = boughtOnly(D.history).slice();   // flags on held names are not trades
  const h = (S.outcome ? all.filter(e => e.outcome === S.outcome) : all).sort((a,b) =>
    b.date.localeCompare(a.date) || a.sym.localeCompare(b.sym));
  const w = all.filter(e => e.outcome === "worked").length;
  const f = all.filter(e => e.outcome === "faded").length;
  const sim = h.filter(e => e.simulated).length;

  const table = h.length ? `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">Every pick, newest first</div>
      <div class="note">picks of the day only · ${w} worked · ${f} faded ·
        ${all.length - w - f} flat${sim ? ` · ${sim} reconstructed` : ""}</div>
      <div style="flex:1 1 20px;"></div>
      <select class="sel" data-outcome-sel>
        ${["", "worked", "faded", "flat"].map(o => `<option value="${o}"${
          (S.outcome||"")===o?" selected":""}>${o ? o : "All outcomes"} (${
          o ? all.filter(e=>e.outcome===o).length : all.length})</option>`).join("")}
      </select></div>
    <div class="scroll"><div style="min-width:600px;">
      <div class="tbl">
        <div style="flex:0 0 96px;">Picked</div>
        <div style="flex:0 0 78px;">Ticker</div>
        <div style="flex:0 0 92px;text-align:right;">At pick</div>
        <div style="flex:0 0 92px;text-align:right;">Now</div>
        <div style="flex:0 0 80px;text-align:right;">Change</div>
        <div style="flex:1 1 130px;">Outcome</div>
      </div>
      ${h.map(e => `<div class="row clickable" data-open="${esc(e.sym)}">
        <div style="display:flex;gap:12px;padding:11px 18px;align-items:center;">
          <div class="mono" style="flex:0 0 96px;font-size:12px;color:var(--ink-5);">
            ${esc(fmtPickDay(e.date))}</div>
          <div class="mono" style="flex:0 0 78px;font-size:13px;font-weight:600;
            color:var(--ink-d);">$${esc(e.sym)}</div>
          <div class="mono" style="flex:0 0 92px;text-align:right;font-size:12px;
            color:var(--ink-2);">${money(e.flag_price)}</div>
          <div class="mono" style="flex:0 0 92px;text-align:right;font-size:12px;
            color:var(--ink-2);">${money(e.last_price)}</div>
          <div class="mono" style="flex:0 0 80px;text-align:right;font-size:13px;
            color:${chgC(e.pct)};">${pctT(e.pct)}</div>
          <div style="flex:1 1 130px;min-width:0;display:flex;align-items:center;gap:8px;">
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")};font-size:10px;">${esc(e.outcome)}</span>
            ${e.simulated ? `<span class="pill" style="${pillCss("warn")};font-size:10px;"
              title="Never sent — reconstructed by replaying the pick rule over that
day's list.">simulated</span>` : ""}
          </div>
        </div></div>`).join("")}
    </div></div>
  </div>` : "";

  return backtest() + table + `<div class="panel dash" style="padding:18px 20px;">
    <div class="eyebrow" style="margin-bottom:8px;">Read of the record</div>
    <div style="font-size:13px;color:var(--ink-3);max-width:78ch;text-wrap:pretty;">
      ${sim ? `${sim} of these were never sent — on those days the pick section did not
      exist yet. Someone read that day's list and judged by hand which names the rule
      would have taken — the rule was not re-run against the data, and the momentum
      arrows it needs no longer exist, so these cannot be checked. They are marked
      reconstructed and are an assertion, not a record. ` : ""}A pick is an attention
      reading, not a recommendation, and the sample is still small enough that the exit
      discipline is better evidenced than the picking.
    </div>
  </div>`;
}

/* ── detail ───────────────────────────────────────────────── */
function detail(){
  const all = [...(D.buzz||[]), ...(D.watch||[]), ...(D.gainers||[])];
  const t = all.find(x => x.sym === S.sel);
  // A name picked weeks ago is not in this run's data — it fell off the scan.
  // That is not a dead end: the pick record still has every time it was flagged,
  // and the live chart is one link away.
  if (!t) {
    const sym = S.sel || "";
    const flags = (D.history || []).filter(e => e.sym === sym)
                   .sort((a, b) => (a.date < b.date ? 1 : -1));
    const PD = {};
    ((B && B.pick_detail) || []).forEach(p => { PD[p.date + "|" + p.sym] = p; });
    const nD = holdDays();
    // A flag raised while the position from an earlier flag was still running is
    // not a trade — listing it beside the real buys invents a history of trades
    // the rule never made.
    const past = flags.filter(e => !heldNotBought(e));
    const skipped = flags.filter(heldNotBought);
    return `<button class="btn" data-go="history" style="margin-bottom:16px;">← BACK</button>
      <div class="panel" style="padding:22px 24px;margin-bottom:16px;">
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
          <div class="mono" style="font-size:26px;font-weight:600;color:var(--ink-d);">
            $${esc(sym)}</div>
          <div style="flex:1 1 20px;"></div>
        </div>
        <div class="note" style="margin-top:10px;">Not in the latest run — this name
          is no longer on the scan, so there is no live price or chart for it here.
          ${past.length ? `It was bought ${past.length} time${past.length===1?"":"s"}.`
                        : ""}${skipped.length ? ` It came up ${skipped.length} more
          time${skipped.length===1?"":"s"} — ${skipped.map(e =>
            fmtPickDay(e.date)).join(", ")} — while the position was still running, so
          the rule did not buy again and ${skipped.length===1?"that flag is":"those flags are"}
          not listed below.` : ""}</div>
        <div style="margin-top:14px;">${chartLinks(sym)}</div>
      </div>
      ${past.length ? `<div class="panel"><div class="scroll"><div style="min-width:560px;">
        <div class="tbl">
          <div style="flex:0 0 210px;">Picked</div>
          <div style="flex:0 0 90px;text-align:right;">At pick</div>
          <div style="flex:0 0 92px;text-align:right;">Still held</div>
          <div style="flex:0 0 104px;text-align:right;">Sold at ${nD}d</div>
          <div style="flex:1 1 90px;"></div>
        </div>
        ${past.map(e => {
          const d = PD[e.date + "|" + e.sym];
          const sold = !d ? `<span style="color:var(--ink-5);">—</span>`
            : d.still_open ? `<span class="note" style="margin:0;">not due</span>`
            : `<span style="color:${chgC(d.ret_hold)};">${pctT(d.ret_hold)}</span>`;
          return `<div class="row"><div style="display:flex;gap:12px;padding:12px 18px;
            align-items:center;">
            <div style="flex:0 0 210px;font-size:13px;color:var(--ink-2);">${
              esc(fmtPickDay(e.date))}</div>
            <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
              color:var(--ink-2);">${money(e.flag_price)}</div>
            <div class="mono" style="flex:0 0 92px;text-align:right;font-size:13px;
              color:${chgC(e.pct)};">${pctT(e.pct)}</div>
            <div class="mono" style="flex:0 0 104px;text-align:right;font-size:13px;
              font-weight:600;">${sold}</div>
            <div style="flex:1 1 90px;display:flex;justify-content:flex-end;">${
              e.simulated ? `<span class="pill" style="${pillCss("warn")};font-size:10px;"
                >reconstructed</span>` : ""}</div>
          </div></div>`; }).join("")}
      </div></div></div>` : ""}`;
  }
  const col = chgC(t.pct);
  const past = boughtOnly(D.history).filter(e => e.sym === t.sym);
  return `<button class="btn" data-go="digest" style="margin-bottom:16px;">← BACK</button>
    <div class="panel" style="padding:22px 24px;margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
        <div class="mono" style="font-size:26px;font-weight:600;color:var(--ink-d);">
          $${esc(t.sym)}</div>
        <div style="font-size:14px;color:var(--ink-5);">${esc(t.name||"")}</div>
        <div style="flex:1 1 20px;"></div>
        <div class="mono" style="font-size:22px;color:var(--ink);">${money(t.price)}</div>
        <div class="mono" style="font-size:16px;color:${col};">${pctT(t.pct)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">${flagsHtml(t)}</div>
      <div style="margin-top:14px;">${chartLinks(t.sym)}</div>
    </div>
    <div class="cols">
      <div class="col-main">
        ${t.chart ? `<div class="panel" style="padding:18px 20px;">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;

        </div>
        ${past.length ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Flagged previously</div>
          ${past.map(e=>`<div style="display:flex;gap:12px;align-items:baseline;
            border-bottom:1px solid var(--rule-2);padding:8px 0;">
            <span class="mono" style="font-size:12px;color:var(--ink-5);flex:0 0 90px;">
              ${esc(fmtPickDay(e.date))}</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${money(e.flag_price)} → ${money(e.last_price)}</span>
            <span class="mono" style="font-size:12px;color:${chgC(e.pct)};margin-left:auto;">
              ${pctT(e.pct)}</span>
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")}">${esc(e.outcome)}</span>
          </div>`).join("")}
        </div>` : ""}
      </div>
      <div class="col-side">
        ${t.er ? `<div class="panel" style="padding:18px 20px;">

        ${t.read ? `<div class="panel" style="padding:18px 20px;">

            ${esc(t.read[2])}</div>
        </div>` : ""}
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Short-term range band · 5 sessions</div>
          ${t.band ? bandHtml(t) : `<div class="note">No recent price frame available.</div>`}
        </div>
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Key stats</div>
          ${(t.stats||[]).length ? (t.stats||[]).map(([k,v])=>`
            <div style="display:flex;justify-content:space-between;gap:12px;
              border-bottom:1px solid var(--rule-2);padding:8px 0;">
              <span style="font-size:12px;color:var(--m);">${esc(k)}</span>
              <span class="mono" style="font-size:12px;color:var(--ink-2);">${esc(v)}</span>
            </div>`).join("") : `<div class="note">Yahoo returned no fundamentals for this symbol.</div>`}
        </div>
        ${t.analyst_rec || t.analyst_target ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Analyst view</div>
          ${t.analyst_rec ? `<div style="display:flex;justify-content:space-between;
            border-bottom:1px solid var(--rule-2);padding:8px 0;">
            <span style="font-size:12px;color:var(--m);">Consensus</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${esc(t.analyst_rec.replace(/_/g," "))}</span></div>` : ""}
          ${t.analyst_target ? `<div class="note" style="margin-top:10px;">
            Analyst price targets are conventionally 12 months out. Yahoo publishes
            no target date with them, so treat the horizon as a convention rather
            than a deadline.</div><div style="display:flex;justify-content:space-between;
            padding:8px 0;"><span style="font-size:12px;color:var(--m);">Mean target · 12-mo</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${money(t.analyst_target)}${t.price ? ` (${pctT((t.analyst_target-t.price)/t.price*100)})` : ""}
            </span></div>` : ""}
        </div>` : ""}
      </div>
    </div>`;
}

/* ── shell ────────────────────────────────────────────────── */
const SCREENS = { digest, watchlist, history, detail };
function render(keepScroll){
  const y = window.scrollY;
  const nav = [["digest","Digest"],["watchlist","Watchlist"],["history","History"]];
  $("#nav").innerHTML = nav.map(([k,l]) =>
    `<button data-go="${k}" aria-current="${S.screen===k}">${l}</button>`).join("");
  $("#app").innerHTML = (SCREENS[S.screen] || digest)();
  // an in-place toggle keeps your position; a screen change goes back to the top
  window.scrollTo({ top: keepScroll ? y : 0 });
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-daymode],[data-go],[data-open],[data-toggle],[data-dismiss],[data-filter],[data-sort],[data-daysort],[data-day-go]");
  if (!el) return;
  const d = el.dataset;
  // sits inside a card that is itself data-open, so it must swallow the click
  if (d.daymode) {
    e.stopPropagation();
    S.dayMode[d.daymode] = S.dayMode[d.daymode] === "day" ? "cum" : "day";
    render(true);
    return;
  }
  // text columns open A→Z, numeric columns open biggest-first
  const flip = (state, key) => state.key === key
    ? { key, dir: -state.dir }
    : { key, dir: TEXT_KEYS.has(key) ? 1 : -1 };
  if (d.sort)          { S.sort = flip(S.sort, d.sort); }
  else if (d.daysort)  { S.daySort = flip(S.daySort, d.daysort); }
  else if (d.go)  { S.screen = d.go; }
  else if (d.open){ S.sel = d.open; S.screen = "detail"; }
  else if (d.toggle)  { S.expanded[d.toggle] = !S.expanded[d.toggle]; }
  else if (d.dismiss) { S.dismissed[d.dismiss] = true; }
  else if (d.dayGo)   { S.day = d.dayGo; S.screen = "watchlist"; }
  if (d.outcome)      { S.outcome = d.outcome === "flat" ? "flat" : d.outcome; }
  else if (d.filter)  { S.filter = d.filter; }
  render();
});

// a <select> fires change, not click
document.addEventListener("change", e => {
  const sec = e.target.closest("[data-section]");
  if (sec) { S.section = sec.value; render(); return; }
  const day = e.target.closest("[data-day]");
  if (day) { S.day = day.value; render(); return; }
  const oc = e.target.closest("[data-outcome-sel]");
  if (oc) { S.outcome = oc.value || null; render(); }
});

// Both files are cache-busted per fetch: GitHub Pages serves them with
// max-age=600, so without the timestamp a reload could show ten-minute-old
// numbers. backtest.json is optional — the board still works without it.
function loadBacktest(){
  return fetch("backtest.json?" + Date.now())
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(b => { if (b) B = b; });
}

function loadData(){
  return fetch("data.json?" + Date.now())
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => {
      D = d;
      const when = new Date(d.generated_at);
      $("#stamp").textContent = when.toLocaleString(undefined,
        { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
      $("#hStamp").textContent = when.toLocaleTimeString(undefined,
        { hour:"2-digit", minute:"2-digit" });
      $("#hTracked").textContent = (d.session && d.session.tracked) ?? (d.buzz||[]).length;
    });
}

// Refresh in place. The run writes data.json and backtest.json seconds apart, so
// both are refetched together — showing fresh picks beside stale holdings is
// exactly the mismatch this board exists to avoid. S is untouched, so a reload
// does not throw you back to the digest or lose the day you were looking at.
let refreshing = false;
function refresh(){
  if (refreshing) return Promise.resolve();
  refreshing = true;
  const was = D && D.generated_at;
  return Promise.all([loadData(), loadBacktest()])
    .then(() => {
      render();
      if (was && D.generated_at !== was) flashUpdated();
    })
    .catch(() => {})            // a failed poll keeps the last good board
    .finally(() => { refreshing = false; });
}

function flashUpdated(){
  const el = $("#stamp");
  if (!el) return;
  el.style.transition = "none";
  el.style.color = "var(--g)";
  el.style.fontWeight = "600";
  setTimeout(() => {
    el.style.transition = "color .8s, font-weight .8s";
    el.style.color = ""; el.style.fontWeight = "";
  }, 1400);
}

// Every 3 minutes while the tab is visible, and immediately on coming back to it
// — a tab left open all day used to sit on whatever it fetched at open time.
// Polling is paused when hidden so a forgotten tab is not hammering the CDN.
const POLL_MS = 180000;
let poll = null;
function startPolling(){
  if (poll === null) poll = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// Both in parallel, one render when they land: rendering on data.json alone
// would draw the board with B still null, so holdings and position size would
// briefly show their fallbacks and then jump.
Promise.all([loadData(), loadBacktest()])
  .then(() => { render(); startPolling(); })
  .catch(err => {
    $("#boot").innerHTML = `<div class="eyebrow" style="margin-bottom:8px;">No data</div>
      Waiting for the first radar run to write <b>data.json</b>.
      <div class="note" style="margin-top:6px;">${esc(err.message)}</div>`;
  });
</script>
