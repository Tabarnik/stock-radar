<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reddit Radar</title>
<link rel="stylesheet" href="./fonts/plex.css">
<style>
  :root{
    --g:#186B41; --r:#B0301F; --a:#8A5F12; --m:#4E4938;
    --ink:#252219; --ink-d:#1B1913; --ink-2:#3B3729; --ink-3:#464130;
    --ink-4:#55503F; --ink-5:#5F5947; --ink-6:#6B6553;
    --rule:rgba(120,112,90,0.18); --rule-2:rgba(120,112,90,0.15);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:#EFEDE1; background-attachment:fixed;
    background-image:
      radial-gradient(900px 700px at 10% -6%, rgba(255,255,255,0.95), transparent 60%),
      radial-gradient(760px 620px at 88% 2%, rgba(198,214,206,0.40), transparent 62%),
      radial-gradient(680px 560px at 74% 58%, rgba(224,208,182,0.32), transparent 62%),
      radial-gradient(720px 640px at 22% 96%, rgba(200,206,220,0.36), transparent 62%);
  }
  body{
    color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection{background:#D9E4D8;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,112,90,0.32);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

  .panel{
    background:rgba(255,255,255,0.26); border:1px solid rgba(255,255,255,0.55);
    border-radius:18px; backdrop-filter:blur(30px) saturate(190%);
    -webkit-backdrop-filter:blur(30px) saturate(190%);
    box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,
               0 0 0 1px rgba(255,255,255,0.35) inset,
               0 14px 40px rgba(90,82,58,0.13), 0 2px 6px rgba(90,82,58,0.06);
    overflow:hidden;
  }
  .panel.hero{background:linear-gradient(180deg,rgba(255,255,255,0.32),rgba(255,255,255,0.22));
    border-color:rgba(255,255,255,0.40);}
  .panel.dash{border:1px dashed rgba(120,112,90,0.26);}

  .mono{font-family:var(--mono);}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-5);}
  .cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .note{font-size:11px;color:var(--ink-6);}

  /* header */
  .bar{position:sticky;top:0;z-index:20;background:rgba(247,245,236,0.55);
    backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);
    border-bottom:1px solid var(--rule);}
  .bar-in{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;
    gap:20px;flex-wrap:wrap;min-height:56px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--g);
    animation:pulseDot 2.4s ease-in-out infinite;}
  .brand{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--ink-5);letter-spacing:.06em;}
  .nav{display:flex;gap:2px;background:rgba(255,255,255,0.20);
    border:1px solid rgba(255,255,255,0.55);border-radius:8px;padding:3px;}
  .nav button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:6px 12px;
    border:0;border-radius:6px;background:transparent;color:var(--ink-6);cursor:pointer;}
  .nav button:hover{color:var(--ink);}
  .nav button[aria-current="true"]{background:rgba(255,255,255,0.62);color:var(--ink-d);
    font-weight:600;box-shadow:0 1px 2px rgba(90,82,58,.10);}

  .wrap{max-width:1320px;margin:0 auto;padding:20px 20px 72px;}
  .cols{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .col-main{flex:3 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px;}
  .col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px;}
  /* grid, not flex: a lone card on the last row must keep its width */
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    align-items:start;}

  .phead{display:flex;align-items:center;gap:12px;padding:14px 18px;
    border-bottom:1px solid var(--rule);flex-wrap:wrap;}
  .row{border-bottom:1px solid var(--rule-2);}
  .row:last-child{border-bottom:0;}
  .rowin{display:flex;align-items:center;gap:14px;padding:13px 18px;flex-wrap:wrap;}
  .accent{width:3px;align-self:stretch;min-height:34px;border-radius:2px;}
  .sym{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink-d);
    letter-spacing:.01em;}
  .co{font-size:11px;color:var(--ink-5);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:150px;}
  .pill{font-family:var(--mono);font-size:11px;border-radius:999px;padding:4px 10px;
    white-space:nowrap;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink-3);
    background:rgba(120,112,90,0.15);border:1px solid rgba(120,112,90,0.26);
    border-radius:999px;padding:5px 11px;}
  .btn{background:rgba(120,112,90,0.15);border:1px solid rgba(120,112,90,0.26);
    color:var(--ink-3);font-family:var(--mono);font-size:11px;padding:5px 10px;
    border-radius:6px;cursor:pointer;}
  .btn:hover{color:var(--ink);border-color:rgba(120,112,90,0.42);}
  .btn.x{background:transparent;border-color:rgba(120,112,90,0.22);color:var(--ink-6);padding:5px 9px;}
  .btn.x:hover{color:var(--r);border-color:rgba(192,57,43,0.35);}
  .btn.wide{width:100%;background:rgba(255,255,255,0.24);border-color:rgba(58,95,148,0.28);
    color:#345C90;letter-spacing:.08em;padding:9px 12px;border-radius:7px;margin-top:16px;}
  .btn.wide:hover{background:rgba(255,255,255,0.40);}
  .fbtn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 10px;
    border-radius:6px;border:1px solid rgba(120,112,90,0.22);background:transparent;
    color:var(--ink-6);cursor:pointer;}
  .fbtn[aria-pressed="true"]{background:rgba(255,255,255,0.55);color:var(--ink-d);
    border-color:rgba(255,255,255,0.75);font-weight:600;}

  .spark{display:flex;align-items:flex-end;gap:2px;height:26px;opacity:.85;}
  .spark i{width:5px;border-radius:1px;display:block;}
  .band{position:relative;height:34px;}
  .band .track{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:3px;
    background:rgba(120,112,90,0.15);}
  .band .fill{position:absolute;top:12px;height:6px;border-radius:3px;}
  .band .mark{position:absolute;top:6px;width:2px;height:18px;border-radius:1px;}
  .bandnum{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:11px;color:var(--ink-5);margin-top:2px;}

  .expand{padding:4px 18px 20px 35px;display:flex;gap:20px;flex-wrap:wrap;
    background:rgba(255,255,255,0.13);}
  .news{display:flex;flex-direction:column;gap:9px;}
  .news .it{display:flex;gap:10px;align-items:baseline;}
  .news .bul{width:4px;height:4px;border-radius:50%;background:rgba(120,112,90,0.42);
    flex:0 0 auto;transform:translateY(-2px);}
  .news .t{font-size:13px;color:#2E2A21;text-wrap:pretty;}

  .clickable{cursor:pointer;}
  .clickable:hover{background:rgba(255,255,255,0.34);}
  .empty{padding:34px 18px;text-align:center;color:var(--ink-6);
    font-family:var(--mono);font-size:12px;}
  .tbl{display:flex;gap:12px;padding:9px 18px;border-bottom:1px solid var(--rule-2);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-6);}
  .scroll{overflow-x:auto;}
  .sortbtn{font:inherit;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-6);background:none;border:0;padding:0;
    cursor:pointer;display:flex;align-items:center;min-width:0;}
  .sortbtn:hover{color:var(--ink-d);}
  .sortbtn.on{color:var(--ink-d);font-weight:600;}
  .sortbtn:focus-visible{outline:2px solid var(--series,#345C90);outline-offset:2px;border-radius:3px;}
  .sel{font-family:var(--mono);font-size:11px;color:var(--ink-2);
    background:rgba(255,255,255,0.55);border:1px solid rgba(120,112,90,0.26);
    border-radius:6px;padding:5px 8px;cursor:pointer;max-width:100%;}
  .sel:hover{border-color:rgba(120,112,90,0.45);}
  .sel:focus-visible{outline:2px solid #345C90;outline-offset:2px;}
  @media(max-width:640px){
    .rowin{gap:10px;padding:12px 14px;}
    .expand{padding:4px 14px 18px 14px;}
    .wrap{padding:16px 14px 56px;}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div style="display:flex;align-items:center;gap:10px;margin-right:4px;">
      <div class="dot"></div>
      <div class="brand">Reddit Radar</div>
      <div class="stamp" id="stamp">—</div>
    </div>
    <div class="nav" id="nav"></div>
    <div style="flex:1 1 40px;"></div>
    <div class="mono" style="display:flex;align-items:center;gap:14px;font-size:11px;color:var(--ink-5);">
      <div style="display:flex;align-items:baseline;gap:6px;">
        <span style="letter-spacing:.08em;">TRACKED</span>
        <span id="hTracked" style="color:var(--ink);">—</span>
      </div>
      <div style="width:1px;height:16px;background:rgba(120,112,90,0.22);"></div>
      <div style="letter-spacing:.08em;" id="hStamp">—</div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="panel" style="padding:34px;text-align:center;color:var(--ink-6);"
       id="boot">Loading radar data…</div>
</div>

<script>
"use strict";
const G="#186B41", R="#B0301F", A="#8A5F12";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PILL = {
  bad:  ["rgba(192,57,43,0.10)","rgba(192,57,43,0.28)","#A6342A"],
  warn: ["rgba(169,120,27,0.12)","rgba(169,120,27,0.32)","#8A5F12"],
  muted:["rgba(120,112,90,0.10)","rgba(120,112,90,0.26)","#55503F"],
  good: ["rgba(31,138,84,0.10)","rgba(31,138,84,0.30)","#1B7548"],
};
const pillCss = k => {
  const c = PILL[k] || PILL.muted;
  return `background:${c[0]};border:1px solid ${c[1]};color:${c[2]};`;
};
const flagKind = f => /chasing|already \+/i.test(f) ? "bad"
  : /penny|micro|vol \d/i.test(f) ? "warn" : "muted";

const money = p => typeof p === "number" ? "$" + p.toFixed(2) : "—";
const pctT  = p => typeof p === "number" ? (p > 0 ? "+" : "") + p.toFixed(1) + "%" : "—";
const chgC  = p => typeof p !== "number" ? "var(--ink-4)" : p > 0 ? G : p < 0 ? R : "var(--ink-4)";

let D = null, B = null;
const S = { screen:"digest", sel:null, filter:"all", expanded:{}, dismissed:{},
            sort:{ key:"ret", dir:-1 },        // "every ticker" table
            daySort:{ key:"date", dir:1 },      // day-by-day table
            section:"all",
            day:"today" };                    // section dropdown filter

// Click a column to sort by it; click again to reverse. Text sorts A→Z first,
// numbers sort biggest-first, since that's the useful default for each.
const TEXT_KEYS = new Set(["sym","tier","date"]);
function applySort(rows, state){
  const { key, dir } = state;
  return [...rows].sort((a,b) => {
    const x = a[key], y = b[key];
    const c = TEXT_KEYS.has(key) ? String(x).localeCompare(String(y)) : ((x||0) - (y||0));
    return c * dir;
  });
}
// attr picks which sort state the header drives, so the two tables stay independent
function sortHead(key, label, flex, right, attr){
  const state = attr === "daysort" ? S.daySort : S.sort;
  const on = state.key === key;
  const arrow = on ? (state.dir === 1 ? " ↑" : " ↓") : "";
  return `<button data-${attr || "sort"}="${key}" class="sortbtn${on ? " on" : ""}"
    style="flex:${flex};${right ? "text-align:right;justify-content:flex-end;" : ""}"
    aria-label="Sort by ${esc(label)}">${esc(label)}${arrow}</button>`;
}

/* ── small pieces ─────────────────────────────────────────── */
function spark(t){
  const v = t.spark || [];
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const col = chgC(t.pct);
  return `<div class="spark" title="Last ${v.length} closes: ${v.map(x=>x.toFixed(2)).join(", ")}">` +
    v.map((x,i) => {
      const h = 6 + ((x - lo) / span) * 20;
      return `<i style="height:${h.toFixed(1)}px;background:${col};opacity:${(0.35+0.65*(i/(v.length-1))).toFixed(2)}"></i>`;
    }).join("") + `</div>`;
}

/* One-year weekly close chart. Drawn from real closes rather than embedding a
   Yahoo/Google widget — those cannot be framed, and an external embed would
   break the page's no-outside-requests guarantee. */
function lineChart(chart){
  if (!chart || !(chart.closes||[]).length) return "";
  const v = chart.closes, d = chart.dates || [];
  const W = 520, H = 150, PADL = 6, PADR = 6, PADT = 10, PADB = 18;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const x = i => PADL + (i / (v.length - 1)) * (W - PADL - PADR);
  const y = c => PADT + (1 - (c - lo) / span) * (H - PADT - PADB);
  const line = v.map((c,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(c).toFixed(1)}`).join("");
  const area = `${line}L${x(v.length-1).toFixed(1)},${H-PADB}L${x(0).toFixed(1)},${H-PADB}Z`;
  const first = v[0], last = v[v.length-1];
  const chg = ((last - first) / first) * 100;
  // coloured by the move the chart actually shows, not by today's tick —
  // a stock up 53% on the year should not draw red because it dipped today
  const col = chgC(chg);
  const id = "g" + Math.abs(v.length * 7 + Math.round(last * 100));
  // three faint gridlines, labelled at the extremes only
  const grid = [0, 0.5, 1].map(f => {
    const gy = PADT + f * (H - PADT - PADB);
    return `<line x1="${PADL}" x2="${W-PADR}" y1="${gy}" y2="${gy}"
      stroke="var(--rule-2)" stroke-width="1"/>`;
  }).join("");
  return `<div style="position:relative;">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="One year of weekly closes, ${chg>=0?"up":"down"} ${Math.abs(chg).toFixed(0)}%"
         style="display:block;overflow:visible;">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(v.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5"
        fill="${col}" stroke="var(--surface,#fff)" stroke-width="2"/>
    </svg>
    <div class="bandnum" style="margin-top:4px;">
      <span>${esc((d[0]||"").slice(0,7))} · ${money(first)}</span>
      <span style="color:${col};font-weight:600;">${pctT(chg)} over the year</span>
      <span>${money(hi)} high · ${money(lo)} low</span>
    </div>
  </div>`;
}

function readPill(t){
  const r = t.read;
  if (!r) return "";
  return `<span class="pill" style="${pillCss(r[1])};font-size:10px;" title="${esc(r[2])}">
    ${esc(r[0])}</span>`;
}
function tonePill(t){
  const tone = t.tone;
  if (!tone) return "";
  const k = tone.label === "positive" ? "good" : tone.label === "negative" ? "bad" : "muted";
  return `<span class="pill" style="${pillCss(k)};font-size:10px;"
    title="Tone of recent headlines (VADER), not Reddit post sentiment">
    news ${esc(tone.label)}</span>`;
}
function erHtml(t, compact){
  const e = t.er;
  // a beat record is worth showing even when the next date is months out,
  // so this must not require e.date
  if (!e) return "";
  const exp = e.expect;
  const bits = [];
  if (e.date) {
    const when = e.days_away !== undefined ? `${e.date} (${e.days_away}d)` : e.date;
    bits.push(`<span class="pill" style="${pillCss("warn")};font-size:10px;">📅 ${esc(when)}</span>`);
  }
  if (exp) bits.push(`<span class="pill" style="${pillCss(
    exp[0]==="good"?"good":exp[0]==="bad"?"bad":"muted")};font-size:10px;"
    title="${esc(exp[1])} — history, not a forecast">${esc(exp[0])} record</span>`);
  if (compact) return bits.join("");
  const rows = [];
  if (e.eps_estimate !== undefined) rows.push(["EPS expected", "$" + e.eps_estimate]);
  if (e.beat_record) rows.push(["Recent record", e.beat_record]);
  if (e.avg_surprise !== undefined) rows.push(["Avg surprise", pctT(e.avg_surprise)]);
  return bits.join("") + (rows.length ? `<div style="margin-top:10px;">${rows.map(([k,v])=>`
    <div style="display:flex;justify-content:space-between;gap:12px;
      border-bottom:1px solid var(--rule-2);padding:7px 0;">
      <span style="font-size:12px;color:var(--m);">${esc(k)}</span>
      <span class="mono" style="font-size:12px;color:var(--ink-2);">${esc(String(v))}</span>
    </div>`).join("")}</div>` : "")
    + (exp ? `<div class="note" style="margin-top:8px;">${esc(exp[1])} — history, not a forecast.</div>` : "");
}

function bandHtml(t){
  if (!t.band) return "";
  const [lo,hi] = t.band, span = (hi - lo) || 1;
  const p = Math.max(0, Math.min(1, ((t.price ?? lo) - lo) / span));
  const col = chgC(t.pct);
  return `<div class="band">
      <div class="track"></div>
      <div class="fill" style="left:6%;width:88%;background:${col}1f;"></div>
      <div class="mark" style="left:${(6 + p*88).toFixed(1)}%;background:${col};"></div>
    </div>
    <div class="bandnum"><span>${money(lo)}</span><span>${money(hi)}</span></div>
    <div class="note" style="margin-top:6px;">5-session realised range — not a target.
      Where the last close sits inside its own recent noise.</div>`;
}

function flagsHtml(t, max){
  const f = (t.flags || []).slice(0, max ?? 99).map(x =>
    `<span class="pill" style="${pillCss(flagKind(x))}">${esc(x)}</span>`);
  if (t.analyst_rec && /BUY/.test(t.analyst_rec))
    f.unshift(`<span class="pill" style="${pillCss("good")}">${esc(t.analyst_rec.replace(/_/g," "))}</span>`);
  if (t.earnings)
    f.push(`<span class="pill" style="${pillCss("warn")}">ER ${esc(t.earnings)}</span>`);
  return f.join("");
}

function newsHtml(t, n){
  const h = (t.headlines || []).slice(0, n ?? 3);
  if (!h.length) return `<div class="note">No headlines returned for this ticker.</div>`;
  return `<div class="news">` + h.map(x =>
    `<div class="it"><div class="bul"></div><div><div class="t">${esc(x)}</div>
     <div class="mono" style="font-size:10px;color:var(--ink-4);letter-spacing:.06em;margin-top:2px;">
     Yahoo Finance</div></div></div>`).join("") + `</div>`;
}

const trendIcon = t => t.mom === "↑" ? "▲" : t.mom === "↓" ? "▼" : "◆";
const attention = t => t.mom === "↑" ? "rising" : t.mom === "↓" ? "cooling" : "flat";

/* ── digest ───────────────────────────────────────────────── */
/* The radar only runs Mon-Fri, so on a weekend (or before the first run of the
   day) the newest data is from an earlier session. Calling that "today" is a
   lie the rest of the page then builds on. */
function sessionInfo(){
  const gen = new Date(D.generated_at);
  const now = new Date();
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
    String(d.getDate()).padStart(2,"0")}`;
  const sameDay = ymd(gen) === ymd(now);
  const weekend = now.getDay() === 0 || now.getDay() === 6;
  const nice = gen.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  return {
    sameDay, weekend, nice,
    // name the day — "today" is wrong every weekend and misleading when stale
    eyebrow: gen.toLocaleDateString(undefined, { weekday:"long" }) + "'s picks",
    dateLabel: gen.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" }),
    word: sameDay ? "today" : "that session",
    note: sameDay ? "" : weekend
      ? `Markets are closed this weekend — showing the last session, ${nice}.`
      : `Showing the last completed run, ${nice}.`,
  };
}

function verdict(){
  const s = D.session || {}, st = (D.standouts || []).length;
  const n = (D.watch || []).length;
  const SI = sessionInfo();
  const title = n
    ? `${n} pick${n>1?"s":""} · ${SI.dateLabel}`
    : `No picks · ${SI.dateLabel}`;
  const body = n
    ? `${n} name${n>1?"s":""} cleared the filter: rising Reddit chatter or an analyst buy, `
      + `with room left to move. ` + (st
        ? `${st} of them ${st>1?"are":"is"} also up on the day and still gaining attention — `
          + `the strictest bar the radar applies.`
        : `None is also up on the day, which is the strictest bar the radar applies — `
          + `so these are reading material, not conviction.`)
    : "Nothing cleared the filter. On this radar that is a normal outcome, not a fault — "
      + "the crowd is loudest about names that have already moved.";
  return `<div class="panel hero" style="flex:3 1 460px;padding:22px 24px;display:flex;
      flex-direction:column;justify-content:center;">
    <div class="eyebrow" style="margin-bottom:10px;">${esc(SI.eyebrow)}</div>
    <div style="font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.12;
      color:var(--ink-d);text-wrap:pretty;">${esc(title)}</div>
    <div style="margin-top:10px;font-size:14px;color:var(--ink-3);max-width:62ch;text-wrap:pretty;">
      ${esc(body)}</div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <div class="chip">${n} pick${n===1?"":"s"}</div>
      <div class="chip">${st} also up + gaining</div>
      <div class="chip">${s.tracked ?? 0} tickers scanned</div>
      <div class="chip" style="color:var(--a);background:rgba(169,120,27,0.12);
        border-color:rgba(169,120,27,0.32);">trends only · not advice</div>
      ${SI.note ? `<div class="chip" style="color:var(--ink-4);">🗓 ${esc(SI.note)}</div>` : ""}
    </div>
  </div>`;
}

function sessionPanel(){
  const s = D.session || {};
  const rows = [
    ["Tickers tracked", s.tracked ?? 0, "var(--ink)"],
    ["Up today", `${s.up ?? 0} / ${s.tracked ?? 0}`, (s.up||0) > (s.down||0) ? G : R],
    ["Flagged for review", s.flagged ?? 0, "var(--ink)"],
    ["Track record", `${(D.history||[]).length} logged`, "var(--ink)"],

  return `<div class="panel" style="flex:1 1 240px;padding:18px 20px;display:flex;

/* What to do with a section, and how that section has actually done.
   Same three words on the Digest and on History, so they can't disagree. */
const ACTION = {
  pick:  "act on these first",
  buzz:  "watch — don't act",
  mover: "don't chase",
};
function tierHead(t){
  const s = B && B.summary && B.summary[t];
  const bits = [`<span class="pill" style="${pillCss(
    t==="pick"?"good":t==="mover"?"warn":"muted")};font-size:10px;">${ACTION[t]}</span>`];
  if (s) {
    const k = s.return_pct >= 5 ? "good" : s.return_pct > -5 ? "muted" : "bad";
    bits.push(`<span class="pill" style="${pillCss(k)};font-size:10px;" title="${
      s.winners} of ${s.positions} tickers rose">record ${
      s.return_pct>0?"+":""}${s.return_pct}%</span>`);
  }
  return bits.join("");
}

// Analyst mean target vs today's price. Their number, not ours — shown as the
// gap it implies so the size of the claim is visible next to who is claiming it.
function upsideLine(t){
  if (typeof t.analyst_target !== "number" || typeof t.price !== "number" || !t.price)
    return "";
  const up = (t.analyst_target - t.price) / t.price * 100;
  return `<div class="mono" style="font-size:12px;color:var(--ink-4);margin-top:8px;">
    <span title="Mean of analyst price targets. These are conventionally 12-month
targets; Yahoo publishes no target date, so no exact deadline is implied."
      >12-mo target</span> <b style="color:var(--ink-2);">${money(t.analyst_target)}</b>
    <span style="color:${chgC(up)};font-weight:600;">${pctT(up)}</span></div>`;
}

/* The trade ticket: what $STAKE buys, and the exit levels decided up front.
   Levels come from the rule that measured best over the real flag history —
   set before you are in the position, which is the entire point of a stop. */
const BUY_STAKE = 1000;
const STOP_PCT = 15;     // trailing stop; best-performing stop rule in the backtest
const TARGET_PCT = 25;

function sellPlan(){
  const q = D.watch || [];
  if (!q.length) return "";
  // measured on picks alone — the only list still acted on
  const RS = (B && B.exit_rules_picks) || [];
  const ALL = (B && B.exit_rules) || [];
  const best = RS[0], hold = RS.find(e => e.rule === "Hold, never sell");
  const allBest = ALL[0], allHold = ALL.find(e => e.rule === "Hold, never sell");
  let evidence;
  if (best && hold) {
    evidence = `Across every pick the radar has made (${hold.positions} positions),
      <b>${esc(best.rule)}</b> was the best exit — ${best.avg_return > 0 ? "+" : ""}${
      best.avg_return}% against ${hold.avg_return > 0 ? "+" : ""}${hold.avg_return}%
      for holding.`;
    if (allBest && allHold) {
      evidence += ` The same pattern holds over the wider ${allHold.positions}-position
        history, where every rule tested beat holding — so cutting early is the part
        with real evidence behind it.`;
    }
  } else {
    evidence = `Set the exit before you are in the position.`;
  }

  return `<div class="panel">
    <div class="phead">
      <div class="cap">Trade plan</div>
      <div class="note">$${BUY_STAKE.toLocaleString()} per pick · exits set now, not later</div>
    </div>
    <div style="padding:14px 18px 4px;">
      <div style="font-size:13px;color:var(--ink-3);text-wrap:pretty;">${evidence}</div>
      <div class="note" style="margin-top:6px;">
        Stop is a ${STOP_PCT}% trailing stop — it follows the price up, never down.
        Target is +${TARGET_PCT}%. Both are rules, not forecasts.</div>
    </div>
    <div class="scroll"><div style="min-width:700px;">
      <div class="tbl">
        <div style="flex:0 0 76px;">Buy</div>
        <div style="flex:0 0 88px;text-align:right;">Price now</div>
        <div style="flex:0 0 68px;text-align:right;">Shares</div>
        <div style="flex:0 0 92px;text-align:right;">Stop −${STOP_PCT}%</div>
        <div style="flex:0 0 96px;text-align:right;">Target +${TARGET_PCT}%</div>
        <div style="flex:0 0 84px;text-align:right;">Risk</div>
        <div style="flex:0 0 84px;text-align:right;">Goal</div>
        <div style="flex:1 1 70px;text-align:right;">R:R</div>
      </div>
      ${(() => {
        let totalRisk = 0, totalGoal = 0, totalCost = 0;
        const body = q.map(t => {
          const p = t.price;
          if (typeof p !== "number" || !p) return "";
          const shares = Math.floor(BUY_STAKE / p);
          if (!shares) return "";
          const stop = p * (1 - STOP_PCT / 100);
          const target = p * (1 + TARGET_PCT / 100);
          const risk = shares * (p - stop);
          const goal = shares * (target - p);
          totalRisk += risk; totalGoal += goal; totalCost += shares * p;
          return `<div class="row clickable" data-open="${esc(t.sym)}">
            <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
              <div class="mono" style="flex:0 0 76px;font-size:14px;font-weight:600;
                color:var(--ink-d);">$${esc(t.sym)}</div>
              <div class="mono" style="flex:0 0 88px;text-align:right;font-size:13px;
                color:var(--ink-2);">${money(p)}</div>
              <div class="mono" style="flex:0 0 68px;text-align:right;font-size:13px;
                color:var(--ink-2);">${shares}</div>
              <div class="mono" style="flex:0 0 92px;text-align:right;font-size:13px;
                color:${R};">${money(stop)}</div>
              <div class="mono" style="flex:0 0 96px;text-align:right;font-size:13px;
                color:${G};">${money(target)}</div>
              <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
                color:${R};">−$${Math.round(risk)}</div>
              <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
                font-weight:600;color:${G};">+$${Math.round(goal)}</div>
              <div class="mono" style="flex:1 1 70px;text-align:right;font-size:12px;
                color:var(--ink-4);">1:${(goal / risk).toFixed(2)}</div>
            </div></div>`;
        }).join("");
        return body + `<div class="row" style="background:rgba(120,112,90,0.07);">
          <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
            <div class="mono" style="flex:0 0 76px;font-size:12px;font-weight:600;
              color:var(--ink-2);letter-spacing:.06em;">TOTAL</div>
            <div class="mono" style="flex:0 0 88px;text-align:right;font-size:12px;
              color:var(--ink-5);">$${Math.round(totalCost).toLocaleString()}</div>
            <div style="flex:0 0 68px;"></div>
            <div style="flex:0 0 92px;"></div>
            <div style="flex:0 0 96px;"></div>
            <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
              font-weight:600;color:${R};">−$${Math.round(totalRisk)}</div>
            <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
              font-weight:600;color:${G};">+$${Math.round(totalGoal)}</div>
            <div class="mono" style="flex:1 1 70px;text-align:right;font-size:12px;
              color:var(--ink-4);">1:${(totalGoal / totalRisk).toFixed(2)}</div>
          </div></div>`;
      })()}
    </div></div>
    <div style="padding:12px 18px 16px;">
      <div class="note">Shares are whole units of $${BUY_STAKE.toLocaleString()} at the
        latest price, so the cash deployed is slightly under that. <b>Risk</b> is what
        the stop costs if it triggers; <b>Goal</b> is what the target pays if it hits.
        R:R is goal divided by risk — both before slippage, and neither is a
        probability. The ${TARGET_PCT}/${STOP_PCT} pair pays
        ${(TARGET_PCT / STOP_PCT).toFixed(2)}x what it risks, so it only comes out
        ahead if it hits more than ${(100 / (1 + TARGET_PCT / STOP_PCT)).toFixed(0)}%
        of the time.</div>
    </div>
  </div>`;
}

/* ── watchlist ────────────────────────────────────────────── */
function watchlist(){
  // Every run appends that day's picks to history.json, so past lists are real
  // records rather than a re-derivation from today's prices.
  const hist = D.history || [];
  const byDay = {};
  hist.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const days = Object.keys(byDay).sort().reverse();
  const today = (D.generated_at || "").slice(0, 10);
  const showing = S.day && (S.day === "today" || byDay[S.day]) ? S.day : "today";
  const isToday = showing === "today";
  const q = D.watch || [];
  const past = isToday ? [] : byDay[showing] || [];

  const options = [`<option value="today"${isToday ? " selected" : ""}>Today (${
    q.length})</option>`].concat(days
      .filter(d => d !== today)
      .map(d => {
        const sim = byDay[d].every(e => e.simulated);
        return `<option value="${d}"${showing === d ? " selected" : ""}>${d} (${
          byDay[d].length})${sim ? " · simulated" : ""}</option>`;
      })).join("");

  const head = `<div class="panel" style="margin-bottom:16px;padding:22px 24px;">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
        <div>
          <div class="eyebrow" style="margin-bottom:10px;">Picks of the day</div>
          <div style="font-size:26px;font-weight:600;letter-spacing:-.02em;
            color:var(--ink-d);">${isToday ? `${q.length} pick${q.length===1?"":"s"} today`
              : `${past.length} pick${past.length===1?"":"s"} on ${esc(showing)}`}</div>
        </div>
        <div style="flex:1 1 20px;"></div>
        <label class="note" for="dayfilter" style="letter-spacing:.06em;">Show</label>
        <select id="dayfilter" class="sel" data-day>${options}</select>
      </div>
      <div style="margin-top:8px;font-size:13px;color:var(--ink-3);max-width:70ch;">
        ${isToday
          ? `Refreshed three times every weekday — pre-market, midday and after the
             close. Each run appends its picks here, so this list is also the record.`
          : `What was picked on ${esc(showing)}, priced at the flag and marked to the
             latest run. This is the record as it was made, not a re-run with
             hindsight.`}</div>
    </div>`;

  if (!isToday) {
    if (!past.length) return head + `<div class="panel"><div class="empty">
      Nothing was picked on ${esc(showing)}.</div></div>`;
    return head + `<div class="panel"><div class="scroll"><div style="min-width:600px;">
      <div class="tbl">
        <div style="flex:0 0 84px;">Ticker</div>
        <div style="flex:0 0 96px;text-align:right;">At pick</div>
        <div style="flex:0 0 96px;text-align:right;">Now</div>
        <div style="flex:0 0 84px;text-align:right;">Change</div>
        <div style="flex:1 1 160px;">Since</div>
      </div>
      ${past.map(e => `<div class="row clickable" data-open="${esc(e.sym)}">
        <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
          <div class="mono" style="flex:0 0 84px;font-size:14px;font-weight:600;
            color:var(--ink-d);">$${esc(e.sym)}</div>
          <div class="mono" style="flex:0 0 96px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(e.flag_price)}</div>
          <div class="mono" style="flex:0 0 96px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(e.last_price)}</div>
          <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
            color:${chgC(e.pct)};">${pctT(e.pct)}</div>
          <div style="flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:10px;">
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")};font-size:10px;">${esc(e.outcome)}</span>
            ${e.simulated ? `<span class="pill" style="${pillCss("warn")};font-size:10px;"
              title="Never sent — the pick section did not exist yet. Today's rule
replayed over that day's list.">simulated</span>` : ""}
            <span style="font-size:12px;color:var(--ink-4);white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis;">${esc(e.note||"")}</span>
          </div>
        </div></div>`).join("")}
    </div></div></div>`;
  }

  return head + (q.length ? `<div class="grid">${q.map(t => `
      <div class="panel" style="min-width:0;padding:16px 18px;">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <span class="sym clickable" data-open="${esc(t.sym)}">$${esc(t.sym)}</span>
          <span class="mono" style="font-size:13px;color:var(--ink-2);">${money(t.price)}</span>
          <span class="mono" style="font-size:13px;color:${chgC(t.pct)};margin-left:auto;">
            ${pctT(t.pct)}</span>
        </div>
        <div class="co" style="max-width:100%;margin-top:2px;">${esc(t.name||"")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;">
          <span class="pill" style="${pillCss("muted")}">${esc(t.tag||"")}</span>
          ${readPill(t)}${erHtml(t, true)}${flagsHtml(t, 1)}
        </div>
        ${upsideLine(t)}
        ${t.band ? bandHtml(t) : ""}
        <div style="margin-top:12px;">${newsHtml(t, 2)}</div>
        <button class="btn" style="margin-top:12px;" data-open="${esc(t.sym)}">OPEN DETAIL →</button>
      </div>`).join("")}</div>`
    : `<div class="panel"><div class="empty">Nothing cleared the filter today.</div></div>`);
}

/* ── backtest (replay of every digest ever sent) ──────────── */
// Same label the Digest uses. These were "Worth Watching" here and "Picks of
// the day" there, which read as two different lists — it is one list.
const TIER = {
  pick:  ["Picks of the day", "the shortlist — the only section framed as something to act on"],
  buzz:  ["Reddit Buzz",    "whatever the crowd was loudest about that day"],
  mover: ["Market gainers", "names that had already jumped, labelled “not a prediction”"],
};
const usd = n => (n < 0 ? "−" : "+") + "$" + Math.abs(Math.round(n)).toLocaleString();

// Plain-language read of a section's record. Descriptive only — it reports what
// happened, it does not forecast what happens next.
// NB: named tierVerdict, not verdict — the digest hero already owns verdict(),
// and a second declaration silently replaced it.
function tierVerdict(t, s){
  if (s.positions < 5)
    return ["muted", "too few to judge",
            `Only ${s.positions} position${s.positions===1?"":"s"} — no read yet.`];
  if (s.return_pct >= 5)
    return ["good", "made money",
            `${s.winners} of ${s.positions} rose. This is the section with a record behind it.`];
  if (s.return_pct > -5)
    return ["muted", "roughly flat",
            `${s.winners} of ${s.positions} rose — close enough to a coin flip to ignore.`];
  return ["bad", "lost money",
          `Only ${s.winners} of ${s.positions} rose. Buying this list cost you money.`];
}

/* Competing sell rules replayed over the same historical positions. The point
   is the comparison against holding, not any single number. */
function exitRules(){
  // picks only — the wider history is quoted as corroboration, not as the headline
  const RS = B.exit_rules_picks || [];
  const ALL = B.exit_rules || [];
  if (RS.length < 3) return "";
  const hold = RS.find(e => e.rule === "Hold, never sell");
  const best = RS[0];
  if (!hold) return "";
  const beat = RS.filter(e => e.avg_return > hold.avg_return).length;
  const stake = B.stake || 0;
  const allHold = ALL.find(e => e.rule === "Hold, never sell");
  const allBeat = allHold ? ALL.filter(e => e.avg_return > allHold.avg_return).length : 0;
  let lead = beat === RS.length - 1
    ? `Every rule tested beat holding these picks.`
    : `${beat} of ${RS.length - 1} rules beat holding these picks.`;
  if (hold.positions < 15) {
    lead += ` Only ${hold.positions} picks so far, most days old — directional, not settled.`;
  }

  return `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">When to sell</div>
      <div class="note">every rule replayed over the same ${hold.positions} picks ·
        $${stake.toLocaleString()} per ticker</div></div>

    <div style="padding:18px;display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;">
      <div>
        <div class="eyebrow" style="margin-bottom:6px;">Best exit for picks</div>
        <div class="mono" style="font-size:26px;font-weight:600;color:${
          best.avg_return >= 0 ? G : R};line-height:1;">${esc(best.rule)}</div>
        <div class="mono" style="font-size:13px;margin-top:6px;color:${
          best.avg_return >= 0 ? G : R};">
          $${Math.round(best.invested||0).toLocaleString()} → $${
            Math.round(best.final).toLocaleString()}
          (${best.avg_return > 0 ? "+" : ""}${best.avg_return}%)</div>
        <div class="mono" style="font-size:12px;color:var(--ink-5);margin-top:4px;">
          vs holding: $${Math.round(hold.final).toLocaleString()}
          (${hold.avg_return > 0 ? "+" : ""}${hold.avg_return}%)</div>
      </div>
      <div style="flex:1 1 280px;min-width:0;">
        <div style="font-size:14px;color:var(--ink-3);text-wrap:pretty;">${esc(lead)}</div>
        <div class="note" style="margin-top:8px;">Replayed on closing prices with no
          costs, slippage or tax. A rule that wins here is a discipline worth having,
          not a guarantee about the next trade.</div>
      </div>
    </div>

    <div class="scroll"><div style="min-width:620px;">
      <div class="tbl">
        <div style="flex:1 1 200px;">Sell rule</div>
        <div style="flex:0 0 104px;text-align:right;">Ends at</div>
        <div style="flex:0 0 84px;text-align:right;">Avg return</div>
        <div style="flex:0 0 70px;text-align:right;">Win rate</div>
        <div style="flex:0 0 86px;text-align:right;">Days held</div>
        <div style="flex:0 0 80px;text-align:right;">Worst</div>
      </div>
      ${RS.slice(0, 5).concat(RS.filter(e => e.rule === "Hold, never sell")).map(e => {
        const isHold = e.rule === "Hold, never sell";
        const better = e.avg_return > hold.avg_return;
        return `<div class="row" ${isHold ? 'style="background:rgba(120,112,90,0.07);"' : ""}>
          <div style="display:flex;gap:12px;padding:11px 18px;align-items:center;">
            <div style="flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;">
              <span style="font-size:13px;color:var(--ink-2);${
                isHold ? "font-weight:600;" : ""}">${esc(e.rule)}</span>
              ${isHold ? `<span class="pill" style="${pillCss("muted")};font-size:10px;">
                baseline</span>` : better ? `<span class="pill" style="${pillCss("good")};
                font-size:10px;">better</span>` : ""}
            </div>
            <div class="mono" style="flex:0 0 104px;text-align:right;font-size:13px;
              font-weight:600;color:${e.avg_return>=0?G:R};">
              $${Math.round(e.final).toLocaleString()}</div>
            <div class="mono" style="flex:0 0 84px;text-align:right;font-size:12px;
              color:${chgC(e.avg_return)};">${pctT(e.avg_return)}</div>
            <div class="mono" style="flex:0 0 70px;text-align:right;font-size:12px;
              color:var(--ink-4);">${e.win_rate}%</div>
            <div class="mono" style="flex:0 0 86px;text-align:right;font-size:12px;
              color:var(--ink-4);">${e.avg_days_held}</div>
            <div class="mono" style="flex:0 0 80px;text-align:right;font-size:12px;
              color:${chgC(e.worst)};">${pctT(e.worst)}</div>
          </div></div>`;
      }).join("")}
    </div></div>
  </div>`;
}

function backtest(){
  if (!B) return "";
  const eq = B.equity || [];
  const start = B.start_cash || 1000;
  const pickRows = (B.rows || []).filter(r => r.tier === "pick");
  if (!eq.length && !pickRows.length) return "";

  const finalBal = eq.length ? eq[eq.length - 1].balance : start;
  const totalPct = ((finalBal - start) / start) * 100;
  const wins = eq.filter(e => e.return_pct > 0).length;

  const curve = eq.length ? `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">Picks, compounded</div>
      <div class="note">$${start.toLocaleString()} into each day's picks, rolled
        into the next — profits included</div></div>

    <div style="padding:20px 18px;display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;">
      <div>
        <div class="mono" style="font-size:14px;color:var(--ink-5);">
          $${start.toLocaleString()} →</div>
        <div class="mono" style="font-size:38px;font-weight:600;letter-spacing:-.02em;
          color:${totalPct>=0?G:R};line-height:1;">$${Math.round(finalBal).toLocaleString()}</div>
        <div class="mono" style="font-size:13px;color:${totalPct>=0?G:R};margin-top:6px;">
          ${totalPct>0?"+":""}${totalPct.toFixed(1)}% over ${eq.length} pick day${
            eq.length===1?"":"s"}</div>
      </div>
      <div style="flex:1 1 240px;min-width:0;font-size:13px;color:var(--ink-3);
        text-wrap:pretty;">
        ${wins} of ${eq.length} pick days made money. Each day's picks are held until
        the next pick day, then the whole balance rotates into the new list — so
        nothing overlaps and the balance is a real running total.
      </div>
    </div>

    <div class="scroll"><div style="min-width:440px;">
      <div class="tbl">
        <div style="flex:1 1 120px;">Pick day</div>
        <div style="flex:0 0 70px;text-align:right;">Picks</div>
        <div style="flex:0 0 90px;text-align:right;">Return</div>
        <div style="flex:0 0 110px;text-align:right;">Balance</div>
      </div>
      ${eq.map(e => `<div class="row"><div style="display:flex;gap:12px;
          padding:11px 18px;align-items:center;">
        <div style="flex:1 1 120px;min-width:0;display:flex;align-items:center;gap:8px;">
          <span class="mono" style="font-size:12px;color:var(--ink-2);">${esc(e.date)}</span>
          ${e.open ? `<span class="pill" style="${pillCss("muted")};font-size:10px;">open</span>` : ""}
        </div>
        <div class="mono" style="flex:0 0 70px;text-align:right;font-size:12px;
          color:var(--ink-4);">${e.picks}</div>
        <div class="mono" style="flex:0 0 90px;text-align:right;font-size:13px;
          color:${chgC(e.return_pct)};">${pctT(e.return_pct)}</div>
        <div class="mono" style="flex:0 0 110px;text-align:right;font-size:13px;
          font-weight:600;color:${e.balance>=start?G:R};">
          $${Math.round(e.balance).toLocaleString()}</div>
      </div></div>`).join("")}
    </div></div>
  </div>` : "";

  return curve + exitRules();
}

/* ── history ──────────────────────────────────────────────── */
function history(){
  const h = (D.history || []).slice().sort((a,b) =>
    b.date.localeCompare(a.date) || a.sym.localeCompare(b.sym));
  const w = h.filter(e => e.outcome === "worked").length;
  const f = h.filter(e => e.outcome === "faded").length;
  const sim = h.filter(e => e.simulated).length;

  const table = h.length ? `<div class="panel" style="margin-bottom:16px;">
    <div class="phead"><div class="cap">Every pick, newest first</div>
      <div class="note">${h.length} picks over ${new Set(h.map(e=>e.date)).size} days ·
        ${w} up 10%+ · ${f} down 10%+${sim ? ` · ${sim} reconstructed` : ""}</div></div>
    <div class="scroll"><div style="min-width:600px;">
      <div class="tbl">
        <div style="flex:0 0 96px;">Picked</div>
        <div style="flex:0 0 78px;">Ticker</div>
        <div style="flex:0 0 92px;text-align:right;">At pick</div>
        <div style="flex:0 0 92px;text-align:right;">Now</div>
        <div style="flex:0 0 80px;text-align:right;">Change</div>
        <div style="flex:1 1 130px;">Outcome</div>
      </div>
      ${h.map(e => `<div class="row clickable" data-open="${esc(e.sym)}">
        <div style="display:flex;gap:12px;padding:11px 18px;align-items:center;">
          <div class="mono" style="flex:0 0 96px;font-size:12px;color:var(--ink-5);">
            ${esc(e.date)}</div>
          <div class="mono" style="flex:0 0 78px;font-size:13px;font-weight:600;
            color:var(--ink-d);">$${esc(e.sym)}</div>
          <div class="mono" style="flex:0 0 92px;text-align:right;font-size:12px;
            color:var(--ink-2);">${money(e.flag_price)}</div>
          <div class="mono" style="flex:0 0 92px;text-align:right;font-size:12px;
            color:var(--ink-2);">${money(e.last_price)}</div>
          <div class="mono" style="flex:0 0 80px;text-align:right;font-size:13px;
            color:${chgC(e.pct)};">${pctT(e.pct)}</div>
          <div style="flex:1 1 130px;min-width:0;display:flex;align-items:center;gap:8px;">
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")};font-size:10px;">${esc(e.outcome)}</span>
            ${e.simulated ? `<span class="pill" style="${pillCss("warn")};font-size:10px;"
              title="Never sent — reconstructed by replaying the pick rule over that
day's list.">simulated</span>` : ""}
          </div>
        </div></div>`).join("")}
    </div></div>
  </div>` : "";

  return backtest() + table + `<div class="panel dash" style="padding:18px 20px;">
    <div class="eyebrow" style="margin-bottom:8px;">Read of the record</div>
    <div style="font-size:13px;color:var(--ink-3);max-width:78ch;text-wrap:pretty;">
      ${sim ? `${sim} of these were never sent — on those days the pick section did not
      exist yet, so the rule was replayed over the list that was sent. They are marked
      simulated and are a reconstruction, not a record. ` : ""}A pick is an attention
      reading, not a recommendation, and the sample is still small enough that the exit
      discipline is better evidenced than the picking.
    </div>
  </div>`;
}

/* ── detail ───────────────────────────────────────────────── */
function detail(){
  const all = [...(D.buzz||[]), ...(D.watch||[]), ...(D.gainers||[])];
  const t = all.find(x => x.sym === S.sel);
  if (!t) return `<div class="panel"><div class="empty">
    $${esc(S.sel||"")} isn't in this run's data.</div></div>`;
  const col = chgC(t.pct);
  const past = (D.history||[]).filter(e => e.sym === t.sym);
  return `<button class="btn" data-go="digest" style="margin-bottom:16px;">← BACK</button>
    <div class="panel" style="padding:22px 24px;margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
        <div class="mono" style="font-size:26px;font-weight:600;color:var(--ink-d);">
          $${esc(t.sym)}</div>
        <div style="font-size:14px;color:var(--ink-5);">${esc(t.name||"")}</div>
        <div style="flex:1 1 20px;"></div>
        <div class="mono" style="font-size:22px;color:var(--ink);">${money(t.price)}</div>
        <div class="mono" style="font-size:16px;color:${col};">${pctT(t.pct)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">${flagsHtml(t)}</div>
    </div>
    <div class="cols">
      <div class="col-main">
        ${t.chart ? `<div class="panel" style="padding:18px 20px;">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
            margin-bottom:12px;">
            <div class="eyebrow">Last 12 months</div>
            <div class="note">weekly closes</div>
          </div>
          ${lineChart(t.chart)}
        </div>` : ""}
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:8px;">Reason it surfaced</div>
          <div style="font-size:14px;color:var(--ink-3);text-wrap:pretty;">
            ${esc(t.reason || "—")}</div>
        </div>
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">News</div>
          ${newsHtml(t, 3)}
        </div>
        ${past.length ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Flagged previously</div>
          ${past.map(e=>`<div style="display:flex;gap:12px;align-items:baseline;
            border-bottom:1px solid var(--rule-2);padding:8px 0;">
            <span class="mono" style="font-size:12px;color:var(--ink-5);flex:0 0 90px;">
              ${esc(e.date)}</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${money(e.flag_price)} → ${money(e.last_price)}</span>
            <span class="mono" style="font-size:12px;color:${chgC(e.pct)};margin-left:auto;">
              ${pctT(e.pct)}</span>
            <span class="pill" style="${pillCss(e.outcome==="worked"?"good":
              e.outcome==="faded"?"bad":"muted")}">${esc(e.outcome)}</span>
          </div>`).join("")}
        </div>` : ""}
      </div>
      <div class="col-side">
        ${t.er ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">${t.er.date ? "Next earnings" : "Earnings record"}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${erHtml(t)}</div>
        </div>` : ""}
        ${t.read ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:10px;">Crowd vs price</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;">
            ${readPill(t)}${tonePill(t)}</div>
          <div style="font-size:13px;color:var(--ink-3);text-wrap:pretty;">
            ${esc(t.read[2])}</div>
        </div>` : ""}
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Short-term range band · 5 sessions</div>
          ${t.band ? bandHtml(t) : `<div class="note">No recent price frame available.</div>`}
        </div>
        <div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Key stats</div>
          ${(t.stats||[]).length ? (t.stats||[]).map(([k,v])=>`
            <div style="display:flex;justify-content:space-between;gap:12px;
              border-bottom:1px solid var(--rule-2);padding:8px 0;">
              <span style="font-size:12px;color:var(--m);">${esc(k)}</span>
              <span class="mono" style="font-size:12px;color:var(--ink-2);">${esc(v)}</span>
            </div>`).join("") : `<div class="note">Yahoo returned no fundamentals for this symbol.</div>`}
        </div>
        ${t.analyst_rec || t.analyst_target ? `<div class="panel" style="padding:18px 20px;">
          <div class="eyebrow" style="margin-bottom:12px;">Analyst view</div>
          ${t.analyst_rec ? `<div style="display:flex;justify-content:space-between;
            border-bottom:1px solid var(--rule-2);padding:8px 0;">
            <span style="font-size:12px;color:var(--m);">Consensus</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${esc(t.analyst_rec.replace(/_/g," "))}</span></div>` : ""}
          ${t.analyst_target ? `<div class="note" style="margin-top:10px;">
            Analyst price targets are conventionally 12 months out. Yahoo publishes
            no target date with them, so treat the horizon as a convention rather
            than a deadline.</div><div style="display:flex;justify-content:space-between;
            padding:8px 0;"><span style="font-size:12px;color:var(--m);">Mean target · 12-mo</span>
            <span class="mono" style="font-size:12px;color:var(--ink-2);">
              ${money(t.analyst_target)}${t.price ? ` (${pctT((t.analyst_target-t.price)/t.price*100)})` : ""}
            </span></div>` : ""}
        </div>` : ""}
      </div>
    </div>`;
}

/* ── shell ────────────────────────────────────────────────── */
const SCREENS = { digest, watchlist, history, detail };
function render(){
  const nav = [["digest","Digest"],["watchlist","Watchlist"],["history","History"]];
  $("#nav").innerHTML = nav.map(([k,l]) =>
    `<button data-go="${k}" aria-current="${S.screen===k}">${l}</button>`).join("");
  $("#app").innerHTML = (SCREENS[S.screen] || digest)();
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-open],[data-toggle],[data-dismiss],[data-filter],[data-sort],[data-daysort]");
  if (!el) return;
  const d = el.dataset;
  // text columns open A→Z, numeric columns open biggest-first
  const flip = (state, key) => state.key === key
    ? { key, dir: -state.dir }
    : { key, dir: TEXT_KEYS.has(key) ? 1 : -1 };
  if (d.sort)          { S.sort = flip(S.sort, d.sort); }
  else if (d.daysort)  { S.daySort = flip(S.daySort, d.daysort); }
  else if (d.go)  { S.screen = d.go; }
  else if (d.open){ S.sel = d.open; S.screen = "detail"; }
  else if (d.toggle)  { S.expanded[d.toggle] = !S.expanded[d.toggle]; }
  else if (d.dismiss) { S.dismissed[d.dismiss] = true; }
  else if (d.filter)  { S.filter = d.filter; }
  render();
});

// a <select> fires change, not click
document.addEventListener("change", e => {
  const sec = e.target.closest("[data-section]");
  if (sec) { S.section = sec.value; render(); return; }
  const day = e.target.closest("[data-day]");
  if (day) { S.day = day.value; render(); }
});

// backtest.json is optional — it only exists once the backtest workflow has run
fetch("backtest.json?" + Date.now())
  .then(r => r.ok ? r.json() : null).catch(() => null)
  .then(b => { B = b; if (D) render(); });

fetch("data.json?" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => {
    D = d;
    const when = new Date(d.generated_at);
    const s = when.toLocaleString(undefined,
      { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
    $("#stamp").textContent = s;
    $("#hStamp").textContent = when.toLocaleTimeString(undefined,
      { hour:"2-digit", minute:"2-digit" });
    $("#hTracked").textContent = (d.session && d.session.tracked) ?? (d.buzz||[]).length;
    render();
  })
  .catch(err => {
    $("#boot").innerHTML = `<div class="eyebrow" style="margin-bottom:8px;">No data</div>
      Waiting for the first radar run to write <b>data.json</b>.
      <div class="note" style="margin-top:6px;">${esc(err.message)}</div>`;
  });
</script>
</body>
</html>
