<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Radar</title>
<link rel="stylesheet" href="./fonts/plex.css">
<style>
  :root{
    --g:#186B41; --r:#B0301F; --a:#8A5F12; --m:#4E4938;
    /* held: a name already in the account, neither a buy nor an outcome —
       it needs its own colour, not a reuse of good/bad */
    --h:#5B3E8E; --h-bg:rgba(91,62,142,0.09); --h-line:rgba(91,62,142,0.30);
    --ink:#252219; --ink-d:#1B1913; --ink-2:#3B3729; --ink-3:#464130;
    --ink-4:#55503F; --ink-5:#5F5947; --ink-6:#6B6553;
    --rule:rgba(120,112,90,0.18); --rule-2:rgba(120,112,90,0.15);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:#EFEDE1; background-attachment:fixed;
    background-image:
      radial-gradient(900px 700px at 10% -6%, rgba(255,255,255,0.95), transparent 60%),
      radial-gradient(760px 620px at 88% 2%, rgba(198,214,206,0.40), transparent 62%),
      radial-gradient(680px 560px at 74% 58%, rgba(224,208,182,0.32), transparent 62%),
      radial-gradient(720px 640px at 22% 96%, rgba(200,206,220,0.36), transparent 62%);
  }
  body{
    color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection{background:#D9E4D8;}

  /* iOS-style switch for the day-strip mode. A real <button role="switch"> so it
     is keyboard reachable and announces its state, rather than a styled div. */
  .swt{
    display:flex; align-items:center; justify-content:center; gap:7px;
    width:100%; margin-top:5px; padding:3px 0;
    background:none; border:0; cursor:pointer; font:inherit;
    border-radius:6px;
  }
  .swt-lbl{
    font-size:9px; letter-spacing:.02em; color:var(--ink-6);
    transition:color .18s, font-weight .18s; white-space:nowrap;
  }
  .swt[aria-checked="false"] .swt-lbl.is-cum,
  .swt[aria-checked="true"]  .swt-lbl.is-day{ color:var(--ink-2); font-weight:600; }
  .swt-track{
    position:relative; flex:0 0 auto; width:26px; height:15px; border-radius:999px;
    background:rgba(120,112,90,0.30); transition:background .18s;
  }
  .swt[aria-checked="true"] .swt-track{ background:var(--h); }
  .swt-knob{
    position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.28);
    transition:transform .18s ease;
  }
  .swt[aria-checked="true"] .swt-knob{ transform:translateX(11px); }
  .swt:focus-visible{ outline:2px solid var(--h); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    .swt-knob, .swt-track, .swt-lbl{ transition:none; }
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,112,90,0.32);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

  .panel{
    background:rgba(255,255,255,0.26); border:1px solid rgba(255,255,255,0.55);
    border-radius:18px; backdrop-filter:blur(30px) saturate(190%);
    -webkit-backdrop-filter:blur(30px) saturate(190%);
    box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,
               0 0 0 1px rgba(255,255,255,0.35) inset,
               0 14px 40px rgba(90,82,58,0.13), 0 2px 6px rgba(90,82,58,0.06);
    overflow:hidden;
  }
  .panel.hero{background:linear-gradient(180deg,rgba(255,255,255,0.32),rgba(255,255,255,0.22));
    border-color:rgba(255,255,255,0.40);}
  .panel.dash{border:1px dashed rgba(120,112,90,0.26);}

  .mono{font-family:var(--mono);}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-5);}
  .cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .note{font-size:11px;color:var(--ink-6);}

  /* header */
  .bar{position:sticky;top:0;z-index:20;background:rgba(247,245,236,0.55);
    backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);
    border-bottom:1px solid var(--rule);}
  .bar-in{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;
    gap:20px;flex-wrap:wrap;min-height:56px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--g);
    animation:pulseDot 2.4s ease-in-out infinite;}
  .brand{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--ink-5);letter-spacing:.06em;}
  .nav{display:flex;gap:2px;background:rgba(255,255,255,0.20);
    border:1px solid rgba(255,255,255,0.55);border-radius:8px;padding:3px;}
  .nav button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:6px 12px;
    border:0;border-radius:6px;background:transparent;color:var(--ink-6);cursor:pointer;}
  .nav button:hover{color:var(--ink);}
  .nav button[aria-current="true"]{background:rgba(255,255,255,0.62);color:var(--ink-d);
    font-weight:600;box-shadow:0 1px 2px rgba(90,82,58,.10);}

  .wrap{max-width:1320px;margin:0 auto;padding:20px 20px 72px;}
  .cols{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .col-main{flex:3 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px;}
  .col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px;}
  /* grid, not flex: a lone card on the last row must keep its width */
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    align-items:start;}

  .phead{display:flex;align-items:center;gap:12px;padding:14px 18px;
    border-bottom:1px solid var(--rule);flex-wrap:wrap;}
  .row{border-bottom:1px solid var(--rule-2);}
  .row:last-child{border-bottom:0;}
  .rowin{display:flex;align-items:center;gap:14px;padding:13px 18px;flex-wrap:wrap;}
  .accent{width:3px;align-self:stretch;min-height:34px;border-radius:2px;}
  .sym{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink-d);
    letter-spacing:.01em;}
  .co{font-size:11px;color:var(--ink-5);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:150px;}
  .pill{font-family:var(--mono);font-size:11px;border-radius:999px;padding:4px 10px;
    white-space:nowrap;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink-3);
    background:rgba(120,112,90,0.15);border:1px solid rgba(120,112,90,0.26);
    border-radius:999px;padding:5px 11px;}
  .btn{background:rgba(120,112,90,0.15);border:1px solid rgba(120,112,90,0.26);
    color:var(--ink-3);font-family:var(--mono);font-size:11px;padding:5px 10px;
    border-radius:6px;cursor:pointer;}
  .btn:hover{color:var(--ink);border-color:rgba(120,112,90,0.42);}
  .btn.x{background:transparent;border-color:rgba(120,112,90,0.22);color:var(--ink-6);padding:5px 9px;}
  .btn.x:hover{color:var(--r);border-color:rgba(192,57,43,0.35);}
  .btn.wide{width:100%;background:rgba(255,255,255,0.24);border-color:rgba(58,95,148,0.28);
    color:#345C90;letter-spacing:.08em;padding:9px 12px;border-radius:7px;margin-top:16px;}
  .btn.wide:hover{background:rgba(255,255,255,0.40);}
  .fbtn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 10px;
    border-radius:6px;border:1px solid rgba(120,112,90,0.22);background:transparent;
    color:var(--ink-6);cursor:pointer;}
  .fbtn[aria-pressed="true"]{background:rgba(255,255,255,0.55);color:var(--ink-d);
    border-color:rgba(255,255,255,0.75);font-weight:600;}

  .spark{display:flex;align-items:flex-end;gap:2px;height:26px;opacity:.85;}
  .spark i{width:5px;border-radius:1px;display:block;}
  .band{position:relative;height:34px;}
  .band .track{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:3px;
    background:rgba(120,112,90,0.15);}
  .band .fill{position:absolute;top:12px;height:6px;border-radius:3px;}
  .band .mark{position:absolute;top:6px;width:2px;height:18px;border-radius:1px;}
  .bandnum{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:11px;color:var(--ink-5);margin-top:2px;}

  .expand{padding:4px 18px 20px 35px;display:flex;gap:20px;flex-wrap:wrap;
    background:rgba(255,255,255,0.13);}
  .news{display:flex;flex-direction:column;gap:9px;}
  .news .it{display:flex;gap:10px;align-items:baseline;}
  .news .bul{width:4px;height:4px;border-radius:50%;background:rgba(120,112,90,0.42);
    flex:0 0 auto;transform:translateY(-2px);}
  .news .t{font-size:13px;color:#2E2A21;text-wrap:pretty;}

  .clickable{cursor:pointer;}
  .clickable:hover{background:rgba(255,255,255,0.34);}
  .empty{padding:34px 18px;text-align:center;color:var(--ink-6);
    font-family:var(--mono);font-size:12px;}
  .tbl{display:flex;gap:12px;padding:9px 18px;border-bottom:1px solid var(--rule-2);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-6);}
  .scroll{overflow-x:auto;}
  .sortbtn{font:inherit;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-6);background:none;border:0;padding:0;
    cursor:pointer;display:flex;align-items:center;min-width:0;}
  .sortbtn:hover{color:var(--ink-d);}
  .sortbtn.on{color:var(--ink-d);font-weight:600;}
  .sortbtn:focus-visible{outline:2px solid var(--series,#345C90);outline-offset:2px;border-radius:3px;}
  .sel{font-family:var(--mono);font-size:11px;color:var(--ink-2);
    background:rgba(255,255,255,0.55);border:1px solid rgba(120,112,90,0.26);
    border-radius:6px;padding:5px 8px;cursor:pointer;max-width:100%;}
  .sel:hover{border-color:rgba(120,112,90,0.45);}
  .sel:focus-visible{outline:2px solid #345C90;outline-offset:2px;}
  @media(max-width:640px){
    .rowin{gap:10px;padding:12px 14px;}
    .expand{padding:4px 14px 18px 14px;}
    .wrap{padding:16px 14px 56px;}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div style="display:flex;align-items:center;gap:10px;margin-right:4px;">
      <div class="dot"></div>
      <div class="brand">Stock Radar</div>
      <button class="stamp" id="stamp" data-go="watchlist" title="Browse previous pick days" style="background:none;border:0;cursor:pointer;padding:0;">—</button>
    </div>
    <div class="nav" id="nav"></div>
    <div style="flex:1 1 40px;"></div>
    <div class="mono" style="display:flex;align-items:center;gap:14px;font-size:11px;color:var(--ink-5);">
      <div style="display:flex;align-items:baseline;gap:6px;">
        <span style="letter-spacing:.08em;">TRACKED</span>
        <span id="hTracked" style="color:var(--ink);">—</span>
      </div>
      <div style="width:1px;height:16px;background:rgba(120,112,90,0.22);"></div>
      <div style="letter-spacing:.08em;" id="hStamp">—</div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="panel" style="padding:34px;text-align:center;color:var(--ink-6);"
       id="boot">Loading radar data…</div>
</div>

<script>
"use strict";
const G="#186B41", R="#B0301F", A="#8A5F12", H="#5B3E8E";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PILL = {
  bad:  ["rgba(192,57,43,0.10)","rgba(192,57,43,0.28)","#A6342A"],
  warn: ["rgba(169,120,27,0.12)","rgba(169,120,27,0.32)","#8A5F12"],
  muted:["rgba(120,112,90,0.10)","rgba(120,112,90,0.26)","#55503F"],
  good: ["rgba(31,138,84,0.10)","rgba(31,138,84,0.30)","#1B7548"],
  held: ["rgba(91,62,142,0.10)","rgba(91,62,142,0.32)","#5B3E8E"],
};
const pillCss = k => {
  const c = PILL[k] || PILL.muted;
  return `background:${c[0]};border:1px solid ${c[1]};color:${c[2]};`;
};
const flagKind = f => /chasing|already \+/i.test(f) ? "bad"
  : /penny|micro|vol \d/i.test(f) ? "warn" : "muted";

const money = p => typeof p === "number" ? "$" + p.toFixed(2) : "—";
const pctT  = p => typeof p === "number" ? (p > 0 ? "+" : "") + p.toFixed(1) + "%" : "—";
const chgC  = p => typeof p !== "number" ? "var(--ink-4)" : p > 0 ? G : p < 0 ? R : "var(--ink-4)";

let D = null, B = null;
const S = { screen:"digest", sel:null, filter:"all", expanded:{}, dismissed:{},
            // per-ticker day-strip mode: absent means "since buy", the default
            dayMode:{},
            sort:{ key:"ret", dir:-1 },        // "every ticker" table
            daySort:{ key:"date", dir:1 },      // day-by-day table
            section:"all",
            day:"today", outcome:null };                    // section dropdown filter

// Click a column to sort by it; click again to reverse. Text sorts A→Z first,
// numbers sort biggest-first, since that's the useful default for each.
const TEXT_KEYS = new Set(["sym","tier","date"]);
function applySort(rows, state){
  const { key, dir } = state;
  return [...rows].sort((a,b) => {
    const x = a[key], y = b[key];
    const c = TEXT_KEYS.has(key) ? String(x).localeCompare(String(y)) : ((x||0) - (y||0));
    return c * dir;
  });
}
// attr picks which sort state the header drives, so the two tables stay independent
function sortHead(key, label, flex, right, attr){
  const state = attr === "daysort" ? S.daySort : S.sort;
  const on = state.key === key;
  const arrow = on ? (state.dir === 1 ? " ↑" : " ↓") : "";
  return `<button data-${attr || "sort"}="${key}" class="sortbtn${on ? " on" : ""}"
    style="flex:${flex};${right ? "text-align:right;justify-content:flex-end;" : ""}"
    aria-label="Sort by ${esc(label)}">${esc(label)}${arrow}</button>`;
}

/* ── small pieces ─────────────────────────────────────────── */
function spark(t){
  const v = t.spark || [];
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const col = chgC(t.pct);
  return `<div class="spark" title="Last ${v.length} closes: ${v.map(x=>x.toFixed(2)).join(", ")}">` +
    v.map((x,i) => {
      const h = 6 + ((x - lo) / span) * 20;
      return `<i style="height:${h.toFixed(1)}px;background:${col};opacity:${(0.35+0.65*(i/(v.length-1))).toFixed(2)}"></i>`;
    }).join("") + `</div>`;
}

/* One-year weekly close chart. Drawn from real closes rather than embedding a
   Yahoo/Google widget — those cannot be framed, and an external embed would
   break the page's no-outside-requests guarantee. */
function lineChart(chart){
  if (!chart || !(chart.closes||[]).length) return "";
  const v = chart.closes, d = chart.dates || [];
  const W = 520, H = 150, PADL = 6, PADR = 6, PADT = 10, PADB = 18;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const x = i => PADL + (i / (v.length - 1)) * (W - PADL - PADR);
  const y = c => PADT + (1 - (c - lo) / span) * (H - PADT - PADB);
  const line = v.map((c,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(c).toFixed(1)}`).join("");
  const area = `${line}L${x(v.length-1).toFixed(1)},${H-PADB}L${x(0).toFixed(1)},${H-PADB}Z`;
  const first = v[0], last = v[v.length-1];
  const chg = ((last - first) / first) * 100;
  // coloured by the move the chart actually shows, not by today's tick —
  // a stock up 53% on the year should not draw red because it dipped today
  const col = chgC(chg);
  const id = "g" + Math.abs(v.length * 7 + Math.round(last * 100));
  // three faint gridlines, labelled at the extremes only
  const grid = [0, 0.5, 1].map(f => {
    const gy = PADT + f * (H - PADT - PADB);
    return `<line x1="${PADL}" x2="${W-PADR}" y1="${gy}" y2="${gy}"
      stroke="var(--rule-2)" stroke-width="1"/>`;
  }).join("");
  return `<div style="position:relative;">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="One year of weekly closes, ${chg>=0?"up":"down"} ${Math.abs(chg).toFixed(0)}%"
         style="display:block;overflow:visible;">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(v.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5"
        fill="${col}" stroke="var(--surface,#fff)" stroke-width="2"/>
    </svg>
    <div class="bandnum" style="margin-top:4px;">
      <span>${esc((d[0]||"").slice(0,7))} · ${money(first)}</span>
      <span style="color:${col};font-weight:600;">${pctT(chg)} over the year</span>
      <span>${money(hi)} high · ${money(lo)} low</span>
    </div>
  </div>`;
}

function readPill(t){
  const r = t.read;
  if (!r) return "";
  return `<span class="pill" style="${pillCss(r[1])};font-size:10px;" title="${esc(r[2])}">
    ${esc(r[0])}</span>`;
}
function tonePill(t){
  const tone = t.tone;
  if (!tone) return "";
  const k = tone.label === "positive" ? "good" : tone.label === "negative" ? "bad" : "muted";
  return `<span class="pill" style="${pillCss(k)};font-size:10px;"
    title="Tone of recent headlines (VADER), not Reddit post sentiment">
    news ${esc(tone.label)}</span>`;
}
function erHtml(t, compact){
  const e = t.er;
  // a beat record is worth showing even when the next date is months out,
  // so this must not require e.date
  if (!e) return "";
  const exp = e.expect;
  const bits = [];
  if (e.date) {
    const when = e.days_away !== undefined ? `${e.date} (${e.days_away}d)` : e.date;
    bits.push(`<span class="pill" style="${pillCss("warn")};font-size:10px;">📅 ${esc(when)}</span>`);
  }
  if (exp) bits.push(`<span class="pill" style="${pillCss(
    exp[0]==="good"?"good":exp[0]==="bad"?"bad":"muted")};font-size:10px;"
    title="${esc(exp[1])} — history, not a forecast">${esc(exp[0])} record</span>`);
  if (compact) return bits.join("");
  const rows = [];
  if (e.eps_estimate !== undefined) rows.push(["EPS expected", "$" + e.eps_estimate]);
  if (e.beat_record) rows.push(["Recent record", e.beat_record]);
  if (e.avg_surprise !== undefined) rows.push(["Avg surprise", pctT(e.avg_surprise)]);
  return bits.join("") + (rows.length ? `<div style="margin-top:10px;">${rows.map(([k,v])=>`
    <div style="display:flex;justify-content:space-between;gap:12px;
      border-bottom:1px solid var(--rule-2);padding:7px 0;">
      <span style="font-size:12px;color:var(--m);">${esc(k)}</span>
      <span class="mono" style="font-size:12px;color:var(--ink-2);">${esc(String(v))}</span>
    </div>`).join("")}</div>` : "")
    + (exp ? `<div class="note" style="margin-top:8px;">${esc(exp[1])} — history, not a forecast.</div>` : "");
}

function bandHtml(t){
  if (!t.band) return "";
  const [lo,hi] = t.band, span = (hi - lo) || 1;
  const p = Math.max(0, Math.min(1, ((t.price ?? lo) - lo) / span));
  const col = chgC(t.pct);
  return `<div class="band">
      <div class="track"></div>
      <div class="fill" style="left:6%;width:88%;background:${col}1f;"></div>
      <div class="mark" style="left:${(6 + p*88).toFixed(1)}%;background:${col};"></div>
    </div>
    <div class="bandnum"><span>${money(lo)}</span><span>${money(hi)}</span></div>
    <div class="note" style="margin-top:6px;">5-session realised range — not a target.
      Where the last close sits inside its own recent noise.</div>`;
}

function flagsHtml(t, max){
  const f = (t.flags || []).slice(0, max ?? 99).map(x =>
    `<span class="pill" style="${pillCss(flagKind(x))}">${esc(x)}</span>`);
  if (t.analyst_rec && /BUY/.test(t.analyst_rec))
    f.unshift(`<span class="pill" style="${pillCss("good")}">${esc(t.analyst_rec.replace(/_/g," "))}</span>`);
  if (t.earnings)
    f.push(`<span class="pill" style="${pillCss("warn")}">ER ${esc(t.earnings)}</span>`);
  return f.join("");
}

function newsHtml(t, n){
  const h = (t.headlines || []).slice(0, n ?? 3);
  if (!h.length) return `<div class="note">No headlines returned for this ticker.</div>`;
  return `<div class="news">` + h.map(x =>
    `<div class="it"><div class="bul"></div><div><div class="t">${esc(x)}</div>
     <div class="mono" style="font-size:10px;color:var(--ink-4);letter-spacing:.06em;margin-top:2px;">
     Yahoo Finance</div></div></div>`).join("") + `</div>`;
}

const trendIcon = t => t.mom === "↑" ? "▲" : t.mom === "↓" ? "▼" : "◆";
const attention = t => t.mom === "↑" ? "rising" : t.mom === "↓" ? "cooling" : "flat";

/* ── digest ───────────────────────────────────────────────── */
/* The radar only runs Mon-Fri, so on a weekend (or before the first run of the
   day) the newest data is from an earlier session. Calling that "today" is a
   lie the rest of the page then builds on. */
function sessionInfo(){
  const gen = new Date(D.generated_at);
  const now = new Date();
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
    String(d.getDate()).padStart(2,"0")}`;
  const sameDay = ymd(gen) === ymd(now);
  const weekend = now.getDay() === 0 || now.getDay() === 6;
  // a weekend run carries Friday's closing prices, so name the session Friday
  const sess = new Date(gen);
  if (sess.getDay() === 6) sess.setDate(sess.getDate() - 1);        // Sat -> Fri
  else if (sess.getDay() === 0) sess.setDate(sess.getDate() - 2);   // Sun -> Fri
  const nice = sess.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  return {
    sameDay, weekend, nice,
    // name the day — "today" is wrong every weekend and misleading when stale
    eyebrow: sess.toLocaleDateString(undefined, { weekday:"long" }) + "'s picks",
    dateLabel: nice,
    word: sameDay ? "today" : "that session",
    note: (!weekend && sameDay) ? "" : weekend
      ? `Markets are shut for the weekend — no new run until Monday. Prices are ${nice}'s close.`
      : `Showing the last completed run, ${nice}.`,
  };
}

function verdict(){
  const s = D.session || {}, st = (D.standouts || []).length;
  const n = (D.watch || []).length;
  const SI = sessionInfo();
  const title = n
    ? `${n} pick${n>1?"s":""} · ${SI.dateLabel}`
    : `No picks · ${SI.dateLabel}`;
  const body = n
    ? `${n} name${n>1?"s":""} cleared the filter: rising Reddit chatter or an analyst buy, `
      + `with room left to move. ` + (st
        ? `${st} of them ${st>1?"are":"is"} also up on the day and still gaining attention — `
          + `the strictest bar the radar applies.`
        : `None is also up on the day, which is the strictest bar the radar applies — `
          + `so these are reading material, not conviction.`)
    : "Nothing cleared the filter. On this radar that is a normal outcome, not a fault — "
      + "the crowd is loudest about names that have already moved.";
  return `<div class="panel hero" style="flex:3 1 460px;padding:22px 24px;display:flex;
      flex-direction:column;justify-content:center;">
    <div class="eyebrow" style="margin-bottom:10px;">${esc(SI.eyebrow)}</div>
    <div style="font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.12;
      color:var(--ink-d);text-wrap:pretty;">${esc(title)}</div>
    <div style="margin-top:10px;font-size:14px;color:var(--ink-3);max-width:62ch;text-wrap:pretty;">
      ${esc(body)}</div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <div class="chip">${n} pick${n===1?"":"s"}</div>
      <div class="chip">${st} also up + gaining</div>
      <div class="chip">${s.tracked ?? 0} tickers scanned</div>
      <div class="chip" style="color:var(--a);background:rgba(169,120,27,0.12);
        border-color:rgba(169,120,27,0.32);">trends only · not advice</div>
      ${SI.note ? `<div class="chip" style="color:var(--ink-4);">🗓 ${esc(SI.note)}</div>` : ""}
    </div>
  </div>`;
}

function sessionPanel(){
  const s = D.session || {};
  const rows = [
    ["Tickers tracked", s.tracked ?? 0, "var(--ink)"],
    ["Up today", `${s.up ?? 0} / ${s.tracked ?? 0}`, (s.up||0) > (s.down||0) ? G : R],
    ["Flagged for review", s.flagged ?? 0, "var(--ink)"],
    ["Track record", `${boughtOnly(D.history).length} bought`, "var(--ink)"],
  ];
  return `<div class="panel" style="flex:1 1 240px;padding:18px 20px;display:flex;
      flex-direction:column;gap:14px;">
    <div class="eyebrow">Session</div>
    ${rows.map(([l,v,c],i)=>`<div style="display:flex;align-items:baseline;
      justify-content:space-between;gap:12px;${i<rows.length-1?
      "border-bottom:1px solid var(--rule-2);padding-bottom:9px;":""}">
      <div style="font-size:12px;color:var(--m);">${esc(l)}</div>
      <div class="mono" style="font-size:13px;color:${c};">${esc(String(v))}</div>
    </div>`).join("")}
  </div>`;
}

/* What to do with a section, and how that section has actually done.
   Same three words on the Digest and on History, so they can't disagree. */
const ACTION = {
  pick:  "act on these first",
  buzz:  "watch — don't act",
  mover: "don't chase",
};
function tierHead(t){
  const s = B && B.summary && B.summary[t];
  const bits = [`<span class="pill" style="${pillCss(
    t==="pick"?"good":t==="mover"?"warn":"muted")};font-size:10px;">${ACTION[t]}</span>`];
  if (s) {
    const k = s.return_pct >= 5 ? "good" : s.return_pct > -5 ? "muted" : "bad";
    bits.push(`<span class="pill" style="${pillCss(k)};font-size:10px;" title="${
      s.winners} of ${s.positions} tickers rose">record ${
      s.return_pct>0?"+":""}${s.return_pct}%</span>`);
  }
  return bits.join("");
}

// Analyst mean target vs today's price. Their number, not ours — shown as the
// gap it implies so the size of the claim is visible next to who is claiming it.
function upsideLine(t){
  if (typeof t.analyst_target !== "number" || typeof t.price !== "number" || !t.price)
    return "";
  const up = (t.analyst_target - t.price) / t.price * 100;
  return `<div class="mono" style="font-size:12px;color:var(--ink-4);margin-top:8px;">
    <span title="Mean of analyst price targets. These are conventionally 12-month
targets; Yahoo publishes no target date, so no exact deadline is implied."
      >12-mo target</span> <b style="color:var(--ink-2);">${money(t.analyst_target)}</b>
    <span style="color:${chgC(up)};font-weight:600;">${pctT(up)}</span></div>`;
}

/* The trade ticket: what $STAKE buys, and the exit levels decided up front.
   Levels come from the rule that measured best over the real flag history —
   set before you are in the position, which is the entire point of a stop. */
// What goes into one pick, taken from the model that produced every number on
// this page: POSITION_FRAC of the account as it now stands. It was hardcoded at
// $1,000 while the backtest was trading 5% of a $10,000 account — so the plan
// told you to buy roughly twice the position the evidence was measured on.
// Read at render time: B is still null while this file is being evaluated.
function buyStake(){
  const acct = (B && (B.final_balance || B.start_cash)) || 10000;
  const frac = (B && B.position_frac) || 0.05;
  return Math.max(1, Math.round(acct * frac));
}
// The rule: a time stop, not a price one. Read at render time, not at parse
// time — B is still null while this file is being evaluated, so a top-level
// const would freeze the fallback in and ignore whatever the backtest traded.
function holdDays(){ return (B && B.curve_days) || 5; }

// What the account is still in, as of the last backtest run: symbol -> days left.
// A name on today's list that is already open is not a second buy.
// A flag raised while the position from an earlier flag was still running is not
// a trade — the rule does not buy a name it already holds. Every list of picks
// filters through here so no screen can quietly count a flag as a purchase.
// The map is rebuilt whenever B changes, since it loads after the first render.
let _pdB = null, _pdM = null;
function pdMap(){
  if (_pdB !== B) {
    _pdB = B; _pdM = {};
    ((B && B.pick_detail) || []).forEach(p => { _pdM[p.date + "|" + p.sym] = p; });
  }
  return _pdM;
}
function heldNotBought(e){
  return !!(pdMap()[e.date + "|" + e.sym] || {}).already_held;
}
function boughtOnly(list){ return (list || []).filter(e => !heldNotBought(e)); }

function openPos(){
  const m = {};
  ((B && B.open_positions) || []).forEach(p => { m[p.sym] = p; });
  return m;
}

// Trading days out, weekends only — market holidays are not known client-side,
// so the date is shown as approximate and the day count is the real instruction.
// Counted from the next day the market is actually open, not from today: on a
// weekend the position cannot be opened until Monday, and counting from today
// would name a sell date only four trading days after the buy.
function nextOpen(){
  const d = new Date();
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}
function fmtDay(d){
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}

// "Friday 22nd June" — pick dates read as days you lived through, not as keys.
// Parsed as local time (not new Date("2026-06-22"), which is parsed as UTC and
// lands on the previous evening west of Greenwich, naming the wrong weekday).
function ord(n){
  if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
  return n + ({1:"st", 2:"nd", 3:"rd"}[n % 10] || "th");
}
function fmtPickDay(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return iso || "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  if (isNaN(d)) return iso;
  return `${d.toLocaleDateString(undefined, {weekday:"long"})} ${ord(d.getDate())} ` +
         d.toLocaleDateString(undefined, {month:"long"});
}

// The chart is a link, never an embed — the board makes zero external requests
// and an iframe or remote image would break that (and the artifact CSP).
// Yahoo only: Google Finance needs the exchange in the URL and guessing NASDAQ
// sent every NYSE name to a dead page.
function chartLinks(sym){
  return `<a class="btn" target="_blank" rel="noopener noreferrer"
    href="https://finance.yahoo.com/quote/${encodeURIComponent(sym)}/chart"
    >YAHOO CHART ↗</a>`;
}
function sellByDate(n){
  const d = nextOpen();
  for (let i = 0; i < n; ) { d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) i++; }
  return fmtDay(d);
}

function sellPlan(){
  const all = D.watch || [];
  if (!all.length) return "";
  // names already in the account are shown separately — buying them again would
  // double a position the rule is already counting down
  const OP = openPos();
  const q = all.filter(t => !OP[t.sym]);
  // measured on picks alone — the only list still acted on
  const RS = (B && B.exit_rules_picks) || [];
  const ALL = (B && B.exit_rules) || [];
  const best = RS[0], hold = RS.find(e => e.rule === "Hold, never sell");
  const rule = RS.find(e => e.rule === `Sell after ${holdDays()} days`) || best;
  const allHold = ALL.find(e => e.rule === "Hold, never sell");
  let evidence;
  if (rule && hold) {
    const sent = rule.positions_real;
    evidence = `Across every pick the radar has made (${hold.positions} positions),
      <b>selling after ${holdDays()} days</b> came out ahead of every price-based exit
      tested — ${rule.avg_return > 0 ? "+" : ""}${rule.avg_return}% against ${
      hold.avg_return > 0 ? "+" : ""}${hold.avg_return}% for holding${
      sent ? `, and +${rule.avg_return_real}% over just the ${sent} picks that were
      really sent` : ""}.`;
    if (allHold) {
      evidence += ` Every rule tested beat holding over the wider
        ${allHold.positions}-position history too — cutting early is the part with
        real evidence behind it.`;
    }
  } else {
    evidence = `Set the exit before you are in the position.`;
  }

  // Everything the account is in right now, not only the names that happen to be
  // on today's list — those were 4 of 15, which is not "what am I holding".
  const OPEN = ((B && B.open_positions) || []).slice();
  const onList = new Set(all.map(t => t.sym));
  const cost = OPEN.reduce((a, o) => a + (o.alloc || 0), 0);
  const val  = OPEN.reduce((a, o) => a + (o.value || 0), 0);
  const pnl  = val - cost;
  const heldPanel = OPEN.length ? `<div class="panel" style="margin-top:16px;">
    <div class="phead"><div class="cap" style="color:${H};">Currently holding</div>
      <div class="note">${OPEN.length} open position${OPEN.length===1?"":"s"} ·
        each sells ${holdDays()} trading days after it was bought</div></div>
    <div style="padding:16px 18px 4px;display:flex;gap:26px;flex-wrap:wrap;
      align-items:baseline;">
      <div><div class="eyebrow" style="margin-bottom:4px;">Cost</div>
        <div class="mono" style="font-size:19px;color:var(--ink-2);"
          >$${Math.round(cost).toLocaleString()}</div></div>
      <div><div class="eyebrow" style="margin-bottom:4px;">Worth now</div>
        <div class="mono" style="font-size:19px;font-weight:600;color:var(--ink-d);"
          >$${Math.round(val).toLocaleString()}</div></div>
      <div><div class="eyebrow" style="margin-bottom:4px;">Unrealised</div>
        <div class="mono" style="font-size:19px;font-weight:600;color:${chgC(pnl)};"
          >${pnl>=0?"+":"\u2212"}$${Math.abs(Math.round(pnl)).toLocaleString()}
          <span style="font-size:13px;">(${pctT(+(pnl/cost*100).toFixed(1))})</span></div></div>
    </div>
    <div class="scroll"><div style="min-width:660px;">
      <div class="tbl">
        <div style="flex:0 0 76px;">Ticker</div>
        <div style="flex:0 0 128px;">Bought</div>
        <div style="flex:0 0 84px;text-align:right;">At</div>
        <div style="flex:0 0 84px;text-align:right;">Now</div>
        <div style="flex:0 0 78px;text-align:right;">Change</div>
        <div style="flex:0 0 82px;text-align:right;">P/L</div>
        <div style="flex:1 1 108px;text-align:right;">Sells in</div>
      </div>
      ${OPEN.map(o => `<div class="row clickable" data-open="${esc(o.sym)}">
        <div style="display:flex;gap:12px;padding:11px 18px;align-items:center;">
          <div class="mono" style="flex:0 0 76px;font-size:14px;font-weight:600;
            color:${H};">$${esc(o.sym)}</div>
          <div style="flex:0 0 128px;min-width:0;font-size:12px;color:var(--ink-4);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${
            esc(fmtPickDay(o.bought))}</div>
          <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(o.entry)}</div>
          <div class="mono" style="flex:0 0 84px;text-align:right;font-size:13px;
            color:var(--ink-2);">${money(o.price)}</div>
          <div class="mono" style="flex:0 0 78px;text-align:right;font-size:13px;
            font-weight:600;color:${chgC(o.ret)};">${pctT(o.ret)}</div>
          <div class="mono" style="flex:0 0 82px;text-align:right;font-size:13px;
            color:${chgC(o.pnl)};">${o.pnl>=0?"+":"\u2212"}$${
            Math.abs(Math.round(o.pnl)).toLocaleString()}</div>
          <div style="flex:1 1 108px;text-align:right;display:flex;gap:6px;
            justify-content:flex-end;align-items:center;">
            ${onList.has(o.sym)
              ? `<span class="pill" style="${pillCss("held")};font-size:9px;"
                  title="On the current list — already held, so not a buy"
                  >on list</span>`
              : (o.bought === (D.generated_at || "").slice(0, 10)
                ? `<span class="pill" style="${pillCss("muted")};font-size:9px;"
                    title="Bought from an earlier run today. The radar runs three times a day and the list is only what qualifies at that moment, so a name can be bought this morning and be gone from the list by the afternoon."
                    >picked earlier</span>`
                : "")}
            <span class="mono" style="font-size:13px;font-weight:600;color:${
              o.days_left === 0 ? R : "var(--ink-d)"};white-space:nowrap;">${
              o.days_left === 0 ? "today" : o.days_left + "d"}</span>
          </div>
        </div></div>`).join("")}
    </div></div>
    <div style="padding:12px 18px 16px;"><div class="note"><b>At</b> is what the
      position was bought at, <b>Change</b> and <b>P/L</b> are from there to the latest
      price — unrealised, so they move until the position sells. <b>Sells in</b> counts
      the trading days left on its ${holdDays()}-day hold. Names tagged <b>on list</b>
      came up again on the current list; they are already held, so they are not a second
      buy. <b>A holding that is not on the list is normal.</b> The list is only what
      qualifies at the moment a run happens and the radar runs three times a day, so a
      name bought this morning can be gone from the afternoon list — the chatter faded,
      or it has already run too far to still qualify. The position still runs its full
      ${holdDays()} days. This panel and the pick list answer different questions.</div></div>
  </div>` : "";

  // every name on the list is already in the account: there is nothing to buy,
  // and an empty table with a $0 total reads as a failure rather than an answer
  if (!q.length) {
    return `<div class="panel">
      <div class="phead"><div class="cap">Trade plan</div>
        <div class="note">nothing to buy today</div></div>
      <div style="padding:16px 18px 18px;">
        <div style="font-size:13px;color:var(--ink-3);text-wrap:pretty;">${evidence}</div>
        <div style="margin-top:12px;padding:10px 14px;border-radius:8px;
          background:rgba(120,112,90,0.09);font-size:13px;color:var(--ink-2);">
          <b>No buys today.</b> All ${all.length} name${all.length===1?"":"s"} on
          today's list ${all.length===1?"is":"are"} already in the account. Each one
          frees up when its ${holdDays()}-day hold runs out, below.</div>
      </div>
    </div>` + heldPanel;
  }

  return `<div class="panel">
    <div class="phead">
      <div class="cap">Trade plan</div>
      <div class="note">$${buyStake().toLocaleString()} per pick · sell after ${holdDays()} days</div>
    </div>
    <div style="padding:14px 18px 4px;">
      <div style="font-size:13px;color:var(--ink-3);text-wrap:pretty;">${evidence}</div>
      <div class="note" style="margin-top:6px;">
        The exit is the calendar, not the price: sell on the ${holdDays()}th trading day
        whatever it is doing. That means <b>no stop loss</b> — the worst single pick
        under this rule still lost ${rule ? Math.abs(rule.worst).toFixed(1) : "12.3"}%,
        and nothing caps a gap down. It is a rule, not a forecast.</div>
      <div style="margin-top:12px;padding:10px 14px;border-radius:8px;
        background:rgba(120,112,90,0.09);display:flex;gap:10px;flex-wrap:wrap;
        align-items:baseline;">
        <div class="eyebrow">Sell every one of these on</div>
        <div class="mono" style="font-size:16px;font-weight:600;color:var(--ink-d);"
          >${esc(sellByDate(holdDays()))}</div>
        <div class="note" style="margin:0;">${holdDays()} trading days after
          ${esc(fmtDay(nextOpen()))}</div>
      </div>
    </div>
    <div class="scroll"><div style="min-width:344px;">
      <div class="tbl">
        <div style="flex:0 0 64px;">Buy</div>
        <div style="flex:0 0 78px;text-align:right;">Price now</div>
        <div style="flex:0 0 52px;text-align:right;">Shares</div>
        <div style="flex:1 1 78px;text-align:right;">Cost</div>
      </div>
      ${(() => {
        let totalCost = 0;
        const body = q.map(t => {
          const p = t.price;
          if (typeof p !== "number" || !p) return "";
          const shares = Math.floor(buyStake() / p);
          if (!shares) return "";
          const cost = shares * p;
          totalCost += cost;
          return `<div class="row clickable" data-open="${esc(t.sym)}">
            <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
              <div class="mono" style="flex:0 0 64px;font-size:14px;font-weight:600;
                color:var(--ink-d);">$${esc(t.sym)}</div>
              <div class="mono" style="flex:0 0 78px;text-align:right;font-size:13px;
                color:var(--ink-2);">${money(p)}</div>
              <div class="mono" style="flex:0 0 52px;text-align:right;font-size:13px;
                color:var(--ink-2);">${shares}</div>
              <div class="mono" style="flex:1 1 78px;text-align:right;font-size:13px;
                color:var(--ink-2);">$${Math.round(cost).toLocaleString()}</div>

        }).join("");
        return body + `<div class="row" style="background:rgba(120,112,90,0.07);">
          <div style="display:flex;gap:12px;padding:12px 18px;align-items:center;">
            <div class="mono" style="flex:0 0 64px;font-size:12px;font-weight:600;
              color:var(--ink-2);letter-spacing:.06em;">TOTAL</div>
            <div style="flex:0 0 78px;"></div>
            <div style="flex:0 0 52px;"></div>
            <div class="mono" style="flex:1 1 78px;text-align:right;font-size:13px;
              font-weight:600;color:var(--ink-2);">$${Math.round(totalCost).toLocaleString()}</div>
          </div></div>`;
      })()}
    </div></div>
    <div style="padding:12px 18px 16px;">
      <div class="note">Each pick gets
        $${buyStake().toLocaleString()} — ${Math.round((B&&B.position_frac||0.05)*100)}% of
        the $${Math.round((B&&(B.final_balance||B.start_cash))||10000).toLocaleString()}
        account, the same slice the backtest above trades, so the plan and the evidence
        describe one strategy. Shares are whole units of that at the latest price, so the
        cash deployed is slightly under it. The sell date counts
        ${holdDays()} trading days from ${esc(fmtDay(nextOpen()))}, the next session you
        can actually buy in, and skips weekends only — a market holiday in between
        pushes it out by one, so treat the day count as the instruction and the date as
        a reminder. Selling on schedule is what frees the cash for the next pick; the
        account cannot stay funded if positions run indefinitely.</div>
    </div>
  </div>` + heldPanel;
}

// Day by day since the buy, one line at a time. Both numbers matter but they
// answer different questions, so the strip shows one and toggles: MU was +18.4%
// on day 1, fell 5.9% on day 2, and was still +11.4% overall. Defaults to
// "since buy" — the running total is what you judge the position on; the daily
// move is what you look up when it surprises you.
function dayStrip(o){
  const path = (o && o.path) || [];
  if (!path.length) return "";
  const n = holdDays();
  const mode = S.dayMode[o.sym] === "day" ? "day" : "cum";
  const key = mode === "day" ? "day_pct" : "cum_pct";
  const cols = [];
  for (let i = 0; i < n; i++) cols.push(path[i] || null);
  const grid = `display:grid;grid-template-columns:repeat(${n},1fr);gap:2px;
    text-align:center;font-size:9.5px;`;
  return `<div style="margin-top:6px;padding:6px 8px 7px;border-radius:7px;
    background:rgba(255,255,255,0.42);border:1px solid var(--rule-2);">
    <div class="mono" style="${grid}color:var(--ink-6);letter-spacing:.02em;">
      ${cols.map((_, i) => `<div>D${i + 1}</div>`).join("")}</div>
    <div class="mono" style="${grid}margin-top:2px;">
      ${cols.map(c => c === null
        ? `<div style="color:var(--ink-6);">\u00b7</div>`
        : `<div style="color:${chgC(c[key])};font-weight:600;">${
            c[key] > 0 ? "+" : c[key] < 0 ? "\u2212" : ""}${
            Math.abs(c[key]).toFixed(1)}</div>`).join("")}</div>
    <button class="swt" data-daymode="${esc(o.sym)}" role="switch"
      aria-checked="${mode === "day"}"
      aria-label="$${esc(o.sym)}: show each day's own move instead of the total since buy"
      title="${mode === "cum" ? "Switch to each day's own move"
                             : "Switch to the running total since the buy"}">
      <span class="swt-lbl is-cum">since buy</span>
      <span class="swt-track"><span class="swt-knob"></span></span>
      <span class="swt-lbl is-day">that day</span>
    </button>
  </div>`;
}

function picksPanel(){
  const q = D.watch || [];
  const OP = openPos();
  const nHeld = q.filter(t => OP[t.sym]).length;
  // gain on the open position, measured from the price it was actually bought at
  const sinceBuy = t => {
    const o = OP[t.sym]; if (!o) return null;
    const ent = ((B && B.pick_detail) || [])
      .filter(p => p.sym === t.sym && p.date === o.bought)[0];
    return ent && ent.entry && typeof t.price === "number"
      ? (t.price - ent.entry) / ent.entry * 100 : null;
  };
  return `<div class="panel">
    <div class="phead">
      <div class="cap">Picks of the day</div>
      <div class="note">rising chatter or an analyst buy, with room left to move${
        nHeld ? ` · <b style="color:${H};">${nHeld} already held</b>, shown in purple —
        not to buy` : ""}</div>
      <div style="flex:1 1 20px;"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${tierHead("pick")}</div>
    </div>
    ${q.length ? `<div style="padding:14px 18px;display:grid;gap:12px;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">
      ${q.map((t,i) => { const o = OP[t.sym], sb = sinceBuy(t);
        return `<div style="border:1px solid ${o ? "var(--h-line)" : "var(--rule-2)"};
          border-radius:12px;padding:12px 14px;background:${
            o ? "var(--h-bg)" : "rgba(255,255,255,0.30)"};cursor:pointer;"
          data-open="${esc(t.sym)}">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <span class="mono" style="font-size:11px;color:${o ? H : "#6E6754"};">${i+1}</span>
          <span class="sym"${o ? ` style="color:${H};"` : ""}>$${esc(t.sym)}</span>
          <span class="mono" style="font-size:13px;color:var(--ink-2);">${money(t.price)}</span>
          <span class="mono" style="font-size:13px;color:${chgC(t.pct)};margin-left:auto;">
            ${pctT(t.pct)}</span>
        </div>
        ${!o ? (() => {
          // what to actually put in — the card said which name to buy but never
          // how much, so the size lived only in the trade-plan table below
          const st = buyStake(), sh = Math.floor(st / (t.price || 0));
          if (!sh) return `<div style="margin-top:8px;padding:6px 9px;border-radius:7px;
            background:rgba(120,112,90,0.09);border:1px solid var(--rule-2);
            font-size:12px;color:var(--ink-4);">One share costs more than the
            $${st.toLocaleString()} slice — skip, or size it by hand.</div>`;
          return `<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
            margin-top:8px;padding:6px 9px;border-radius:7px;
            background:rgba(31,138,84,0.07);border:1px solid rgba(31,138,84,0.22);">
            <span class="mono" style="font-size:10px;letter-spacing:.06em;color:${G};
              font-weight:600;">BUY</span>
            <span class="mono" style="font-size:13px;font-weight:600;color:var(--ink-d);"
              >${sh} share${sh===1?"":"s"}</span>
            <span style="font-size:11px;color:var(--ink-5);">\u2248 $${
              Math.round(sh * t.price).toLocaleString()}</span>
            <span style="font-size:11px;color:var(--ink-5);margin-left:auto;
              white-space:nowrap;">sell ${esc(sellByDate(holdDays()))}</span>
          </div>`; })() : ""}
        ${o ? `<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
          margin-top:8px;padding:6px 9px;border-radius:7px;background:var(--h-bg);
          border:1px solid var(--h-line);">
          <span class="mono" style="font-size:10px;letter-spacing:.06em;color:${H};
            font-weight:600;">HOLDING · DON'T BUY</span>
          ${sb === null ? "" : `<span class="mono" style="font-size:12px;font-weight:600;
            color:${chgC(sb)};">${pctT(+sb.toFixed(1))}</span>
            <span style="font-size:11px;color:var(--ink-5);">since buy</span>`}
          <span style="font-size:11px;color:${H};margin-left:auto;white-space:nowrap;">${
            typeof o.days_left === "number"
              ? (o.days_left === 0 ? "sell today" : `sell in ${o.days_left}d`)

        <div class="co" style="max-width:100%;margin-top:2px;">${esc(t.name||"")}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;">

}




function recordPanel(){
  // counts trades, not flags: a name flagged while already held was never bought
  const h = boughtOnly(D.history);
  const skipped = (D.history || []).length - h.length;
  // `all` is history()'s local — referencing it here threw a ReferenceError and
  // blanked every screen, since render() builds the digest through this panel.
  const w = h.filter(e => e.outcome === "worked").length;
  const f = h.filter(e => e.outcome === "faded").length;
  const n = h.filter(e => e.outcome === "flat").length;
  const stats = [[w,"worked",G],[f,"faded",R],[n,"flat","var(--ink-4)"]];
  return `<div class="panel" style="padding:16px 18px;">
    <div class="cap" style="margin-bottom:2px;">Picks track record</div>
    <div class="note" style="margin-bottom:12px;">picks of the day only · no buzz,

        skipped===1?"":"s"} on names already held ${skipped===1?"is":"are"} left
        out` : ""}</div>
    ${h.length ? `<div style="display:flex;gap:16px;flex-wrap:wrap;">
      ${stats.map(([v,l,c])=>`<button data-go="history" data-outcome="${l}"
